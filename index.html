<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>골프 날씨</title>
<meta name="description" content="전국 골프장의 예상 날씨(고도 반영)와 기상청 예보를 나란히 비교합니다.">
<meta name="theme-color" content="#0a2b4a">
<!-- 홈 화면 앱(PWA) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골프날씨">
<meta name="application-name" content="골프날씨">
<!-- 카카오톡 등에서 링크 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:title" content="골프 날씨">
<meta property="og:description" content="골프장 검색 → 예상 날씨와 기상청 예보 비교. 홈 화면에 추가하면 앱처럼 씁니다.">
<meta property="og:image" content="icon-512.png">
<style>
/* ── 색 팔레트 ────────────────────────────────────────────
   짙은 남색(신뢰) → 하늘색(날씨) 한 축으로 통일한다.
   의미색(강수 파랑, 미세먼지 등급, 골프지수)은 알아볼 수 있어야 하므로 건드리지 않는다. */
:root{
  --navy:#0a2b4a; --navy2:#123f68;
  --brand:#15568f; --brand2:#1d74b8;
  --sky:#3fa3dd;  --sky2:#79c6ea; --sky3:#b3ddf3; --sky4:#dcefFB;
  --wash:#eef4fa; --line:#d4e3f0; --line2:#e8f1f8;
  --ink:#0e2334;  --ink2:#3d6183; --ink3:#6f8da8;
  --rain:#1f6fd0;
  --shadow:0 2px 10px rgba(10,43,74,.055);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     background:var(--wash);min-height:100vh;color:var(--ink);padding-bottom:44px;
     -webkit-font-smoothing:antialiased}

/* ── 헤더 ─────────────────────────────────────────────── */
#hdr{background:linear-gradient(115deg,var(--navy),var(--brand) 78%,var(--brand2));
     color:#fff;padding:14px 16px;display:flex;align-items:center;gap:9px;
     box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 2px 12px rgba(10,43,74,.22);cursor:pointer}
#hdr h1{font-size:17px;font-weight:600;flex:1;letter-spacing:-.2px}
#hdr .hdr-s{font-size:11px;color:#b8d8ef;font-weight:500;letter-spacing:.2px}

/* ── 홈 화면 추가 안내 ─────────────────────────────────── */
#pwaBar{display:none;background:#f2f9fe;border-bottom:1px solid var(--sky3);padding:11px 14px;
        font-size:13px;line-height:1.6;color:var(--ink2)}
#pwaBar b{color:var(--brand)}
#pwaBar .pw-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#pwaBar button{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
#pwaBar .pw-go{background:var(--brand);color:#fff}
#pwaBar .pw-x{background:var(--sky4);color:var(--brand)}

/* ── 검색 ─────────────────────────────────────────────── */
#srch{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);
      padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:99}
#srow{display:flex;gap:8px}
#inp{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;
     outline:none;background:#f6fafd;color:var(--ink);transition:border-color .15s,background .15s}
#inp::placeholder{color:var(--ink3)}
#inp:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(63,163,221,.14)}
#goBtn{background:linear-gradient(140deg,var(--brand),var(--brand2));color:#fff;border:none;
       padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
#goBtn:active{transform:scale(.97)}
#slist{margin-top:8px;display:none;background:#fff;border:1px solid var(--line);border-radius:14px;
       overflow:hidden;box-shadow:0 8px 28px rgba(10,43,74,.16);max-height:300px;overflow-y:auto}
.si{padding:14px;cursor:pointer;font-size:18px;border-bottom:1px solid var(--line2);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
.si-nm{font-size:18px;font-weight:600;line-height:1.3}
.si:last-child{border-bottom:none}
.si:active{background:var(--sky4)}
.si-loc{font-size:13px;color:var(--ink3);flex-shrink:0}

#main{padding:14px;max-width:600px;margin:0 auto}
.empty{text-align:center;padding:60px 16px;color:var(--ink3)}

/* ── 첫 화면 ──────────────────────────────────────────── */
.home{animation:homeIn .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes homeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 20px 20px;color:#fff;
      background:linear-gradient(155deg,var(--navy) 0%,var(--brand) 54%,var(--brand2) 100%);
      box-shadow:0 12px 32px rgba(10,43,74,.26)}
.hero::before{content:"";position:absolute;top:-76px;right:-54px;width:200px;height:200px;border-radius:50%;
      background:radial-gradient(circle,rgba(121,198,234,.42),transparent 70%)}
.hero::after{content:"";position:absolute;bottom:-96px;left:-46px;width:190px;height:190px;border-radius:50%;
      background:radial-gradient(circle,rgba(63,163,221,.26),transparent 70%)}
.hero>*{position:relative}
.hero-mark{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
      font-size:25px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);margin-bottom:13px}
.hero-t{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.hero-s{font-size:13.5px;line-height:1.65;margin-top:7px;color:#cbe4f7}
.hero-s b{color:#fff;font-weight:600}
.hero-st{display:flex;margin-top:17px;border-top:1px solid rgba(255,255,255,.17);padding-top:13px}
.hero-st div{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.15)}
.hero-st div:first-child{border-left:none}
.hero-st b{display:block;font-size:17px;font-weight:700;letter-spacing:-.3px}
.hero-st span{font-size:10.5px;color:#b3d5ef;letter-spacing:.2px}

.hlabel{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.7px;
        text-transform:uppercase;margin:21px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;
      font-weight:500;color:var(--brand);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
      box-shadow:var(--shadow);transition:transform .12s,background .12s,border-color .12s}
.chip:active{background:var(--sky4);border-color:var(--sky2);transform:scale(.96)}
.chip s{text-decoration:none;font-size:11px;color:var(--ink3);font-weight:400}

.how{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:21px;
     box-shadow:var(--shadow)}
.how-t{font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:15px}
.how-l{list-style:none;counter-reset:h}
.how-l li{counter-increment:h;position:relative;padding:0 0 15px 34px}
.how-l li:last-child{padding-bottom:2px}
.how-l li::before{content:counter(h);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;
      background:linear-gradient(140deg,var(--brand2),var(--sky));color:#fff;font-size:11.5px;font-weight:700;
      display:flex;align-items:center;justify-content:center}
.how-l li:not(:last-child)::after{content:"";position:absolute;left:11px;top:27px;bottom:1px;width:1.5px;
      background:linear-gradient(var(--sky3),var(--line2))}
.how-l b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.how-l span{display:block;font-size:12px;line-height:1.62;color:var(--ink2)}
.how-l em{font-style:normal;color:var(--brand2);font-weight:600}
.how-src{margin-top:4px;padding-top:12px;border-top:1px solid var(--line2);
         font-size:11px;color:var(--ink3);letter-spacing:.2px;line-height:1.6}

/* ── 로딩 (홀인원 애니메이션) ──────────────────────────── */
.loader{text-align:center;padding:34px 16px 30px;border-radius:20px;color:#fff;
        background:linear-gradient(150deg,var(--navy),var(--brand) 60%,var(--brand2));
        box-shadow:0 12px 30px rgba(10,43,74,.24)}
.loader .ld-nm{font-size:15px;font-weight:600}
.loader .ld-sub{font-size:13px;margin-top:4px;color:#bcdcf2}
.gload{width:132px;height:92px;margin:0 auto 10px;display:block}
/* 공이 굴러와 홀에 빠진다 (1.9초 반복)
   SVG 는 transform-box 기본값이 view-box 이므로 transform-origin 을
   반드시 px 좌표로 명시해야 한다. center 로 두면 뷰박스 중심을 축으로 돌아버린다. */
.hi-x{animation:hix 1.9s cubic-bezier(.22,.55,.35,1) infinite}
@keyframes hix{
  0%{transform:translateX(-14px)}
  70%{transform:translateX(89px)}
  100%{transform:translateX(89px)}
}
.hi-y{animation:hiy 1.9s ease-in infinite}
@keyframes hiy{
  0%,70%{transform:translateY(56px)}
  73%{transform:translateY(57px)}
  92%{transform:translateY(72px)}
  100%{transform:translateY(72px)}
}
/* 구르기: 이동거리 103px ÷ 공 둘레 39px ≈ 2.6회전 = 950° */
.hi-roll{transform-origin:8px 8px;animation:hiroll 1.9s cubic-bezier(.22,.55,.35,1) infinite}
@keyframes hiroll{0%{transform:rotate(0)}70%,100%{transform:rotate(950deg)}}
/* 공은 축소하지 않는다. 홀 표면 아래로 잠긴 만큼 clip-path 로 잘려 사라진다. */
.hi-fade{animation:hifade 1.9s linear infinite}
@keyframes hifade{0%,93%{opacity:1}95%,100%{opacity:0}}
.hi-sh{transform-origin:8px 70px;animation:hish 1.9s ease-in infinite}
@keyframes hish{
  0%,70%{opacity:.24;transform:scale(1,1)}
  80%{opacity:.1;transform:scale(.6,.5)}
  86%{opacity:0}
  100%{opacity:0}
}
/* 깃대: 공이 들어가는 순간 살짝 흔들린다 */
.hi-flag{transform-origin:97px 70px;animation:hifl 1.9s ease-out infinite}
@keyframes hifl{
  0%,74%{transform:rotate(0)}
  82%{transform:rotate(-8deg)}
  90%{transform:rotate(4deg)}
  100%{transform:rotate(0)}
}
.errmsg{background:#fff5f3;border:1px solid #f6cdc4;border-radius:14px;padding:16px;
        color:#b13a22;font-size:14px;line-height:1.7}

/* ── 현재 날씨 카드 ───────────────────────────────────── */
#curCard{position:relative;overflow:hidden;color:#fff;border-radius:20px;padding:18px 16px;margin-bottom:12px;
         background:linear-gradient(152deg,var(--navy) 0%,var(--brand) 56%,var(--brand2) 100%);
         box-shadow:0 12px 30px rgba(10,43,74,.24)}
#curCard::before{content:"";position:absolute;top:-84px;right:-58px;width:210px;height:210px;border-radius:50%;
         background:radial-gradient(circle,rgba(121,198,234,.34),transparent 70%)}
#curCard>*{position:relative}
.cloc{font-size:13px;margin-bottom:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cnm{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
.cloc-r{color:#b8d8ef}
.cstamp{font-size:12px;font-weight:600;color:#cbe4f7;margin-bottom:10px}
.crow{display:flex;justify-content:space-between;align-items:flex-start}
.btlabel{font-size:12px;font-weight:600;color:#bcdcf2;margin-bottom:1px}
.btemp{font-size:56px;font-weight:200;line-height:1;letter-spacing:-2px}
.feel{font-size:13px;color:#cbe4f7;margin-top:4px}
.wico{font-size:52px;line-height:1}
.meta4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mi{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.13);
    border-radius:11px;padding:10px 6px;text-align:center}
.mi-v{font-size:15px;font-weight:600}
.mi-l{font-size:10px;color:#c3e0f5;margin-top:2px}

/* ── 골프 지수 ────────────────────────────────────────── */
#gibox{border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
       box-shadow:var(--shadow)}
.ab-g{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:700;font-size:11.5px}
.dr-air{font-size:11px;color:var(--ink2);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.gi-n{font-size:42px;font-weight:700;line-height:1;min-width:56px;letter-spacing:-1.5px}
.gi-h{font-size:15px;font-weight:600}
.gi-s{font-size:12px;margin-top:3px;opacity:.85}

/* ── 탭 ───────────────────────────────────────────────── */
#tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
#tabs::-webkit-scrollbar{display:none}
.tb{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:9px 16px;font-size:14px;
    font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s}
.tb:active{transform:scale(.97)}
.tb.on{background:linear-gradient(140deg,var(--brand),var(--brand2));color:#fff;border-color:var(--brand);
       box-shadow:0 3px 10px rgba(21,86,143,.28)}
.sec{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}

/* ── 시간대별 스트립 ──────────────────────────────────── */
.hscroll{overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.hrow{display:flex;gap:6px;width:max-content;padding-bottom:4px}
.hc{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 6px;text-align:center;
    width:74px;flex-shrink:0}
.hair{font-size:9.5px;margin-top:3px;padding-top:3px;border-top:1px dashed var(--line2);line-height:1.35}
.hsrc{font-size:8px;color:#b08a3a;margin-left:2px}
.hair i{font-style:normal;color:var(--ink3);font-size:8.5px;display:block}
.hc.now{border-color:var(--sky);background:linear-gradient(170deg,#f4fbff,var(--sky4));
        box-shadow:0 0 0 3px rgba(63,163,221,.13)}
.ht{font-size:11px;color:var(--ink3);margin-bottom:4px}
.hico{font-size:20px;margin-bottom:2px}
.htemp{font-size:14px;font-weight:600}
.hrain{font-size:11px;color:var(--rain);margin-top:3px}
.hwind{font-size:10px;color:var(--ink3);margin-top:2px}
.hwind i{font-style:normal;font-size:7.5px;margin-left:1px;opacity:.72;letter-spacing:-.2px}
.day-sep{display:flex;flex-direction:column;align-items:center;justify-content:center;width:32px;flex-shrink:0}
.day-sep-inner{writing-mode:vertical-rl;font-size:10px;font-weight:700;color:var(--brand);
    background:var(--sky4);border:1px solid var(--sky3);border-radius:7px;padding:5px 3px;
    letter-spacing:.5px;white-space:nowrap}

/* ── 일별 목록 ────────────────────────────────────────── */
.dr{background:#fff;border-radius:13px;padding:13px 12px;margin-bottom:8px;border:1.5px solid var(--line);
    cursor:pointer;box-shadow:var(--shadow)}
.dr.open{border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,163,221,.12)}
.dr-row{display:flex;align-items:center;gap:8px}
.dr-date{font-size:13px;font-weight:600;width:76px;flex-shrink:0}
.dr-ico{font-size:22px;width:28px;text-align:center;flex-shrink:0}
.dr-mid{flex:1;min-width:0}
.dr-desc{font-size:13px}
.gi-badge{display:inline-block;padding:1px 6px;border-radius:6px;font-weight:600;font-size:11px;margin-top:2px}
.dr-rain{font-size:13px;color:var(--rain);flex-shrink:0;margin-right:4px}
.dr-temps{font-size:14px;font-weight:600;flex-shrink:0;text-align:right;line-height:1.45;min-width:66px}
.dr-lbl{font-size:9.5px;font-weight:600;color:var(--ink3);letter-spacing:-.3px;margin-right:2px}
.dr-src{font-size:8.5px;font-weight:600;color:var(--ink3);letter-spacing:-.3px;margin-bottom:1px}
.legend{font-size:11px;color:var(--ink2);line-height:1.7;background:#f4fafe;border:1px solid var(--line2);
        border-radius:11px;padding:9px 11px;margin:-2px 0 10px}
.legend b{color:var(--brand)}
.dr-lo{font-size:13px;color:var(--ink3);font-weight:400}
.dd{margin-top:10px;background:#f6fbfe;border:1px solid var(--line2);border-radius:11px;padding:10px;
    display:none;grid-template-columns:1fr 1fr;gap:8px}
.dd.show{display:grid}
.ddi-l{font-size:11px;color:var(--ink3)}
.ddi-v{font-size:14px;font-weight:600;margin-top:2px}
.dr-kma{font-size:11px;color:var(--ink2);margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}

/* ── 그래프 ───────────────────────────────────────────── */
.chart-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
            overflow:hidden;box-shadow:var(--shadow)}
.chart-t{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
.km-note{font-size:11px;color:var(--ink2);margin:-4px 0 12px;line-height:1.6}
.km-warn{background:#fff8e8;border:1px solid #f0dca0;border-radius:12px;padding:10px 12px;font-size:12px;
         color:#6a5000;line-height:1.6;margin-bottom:12px}
.bar-wrap{display:flex;align-items:flex-end;gap:5px;height:130px;padding-bottom:22px;width:max-content}
.bw{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0}
.bv{font-size:9px;font-weight:600;margin-bottom:2px}
.bar{border-radius:3px 3px 0 0;width:13px;min-height:3px}
.bar-wrap>.bw>div>.bar:only-child{width:28px}
.bl{font-size:9px;color:var(--ink2);margin-top:3px;transform:rotate(-30deg);transform-origin:top center;
    white-space:nowrap}
</style>
</head>
<body>
<div id="hdr" onclick="goHome()"><span style="font-size:20px">⛳</span><h1>골프 날씨</h1><span class="hdr-s">고도 반영 예보</span></div>
<div id="pwaBar"></div>
<div id="srch">
  <div id="srow">
    <input id="inp" type="search" placeholder="골프장 검색 (예: 세이지, 파인, 베어)" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="goBtn">검색</button>
  </div>
  <div id="slist"></div>
</div>
<div id="main">
  <!-- JS 가 renderHome() 으로 채운다. 아래는 스크립트 실패 시 대비용. -->
  <div class="empty">
    <div style="font-size:44px;margin-bottom:12px">⛳</div>
    <p style="font-size:15px;font-weight:500">골프장을 검색해 주세요</p>
  </div>
</div>
<script>
// ── 전국 골프장 DB (OpenStreetMap 실측 좌표 · 해발고도 포함) ──
// [이름, 지역, 위도, 경도, 해발m, 중기예보 지점코드, 대기측정소명, (선택)별칭]
const DB=[
["123 GC","경기 고양",37.64043,126.90558,44,"11B20302","신원동"],
["360도 CC","경기 여주",37.29690,127.73642,227,"11B20703","문막읍"],

// 평균 2.2°C 낮게 나왔다. ICON 이 평균절대오차 1.34°C 로 뚜렷하게 정확하다.
// 다만 ICON 은 약 7~8일까지만, UV 는 제공하지 않으므로 두 모델을 함께 받아
//   기온·습도·강수확률·풍속·하늘 → ICON 우선, 없으면 best_match
//   UV, 8일 이후                → best_match
// 로 채운다.
const OM_MODELS="icon_seamless,best_match";

            "weathercode","windspeed_10m","winddirection_10m","uv_index"];
const OM_D=["weathercode","temperature_2m_max","temperature_2m_min","precipitation_sum",
            "precipitation_probability_max","windspeed_10m_max","winddirection_10m_dominant",
            "sunrise","sunset","uv_index_max"];
// 모델별로 접미어가 붙어 오는 응답을 하나로 합친다.
function mergeModels(o){
  if(!o||!o.hourly)return o;
  const fold=(sec,keys)=>{
    const s=o[sec]||{}, t=s.time||[], out={time:t};
    for(const k of keys){
      const a=s[k+"_icon_seamless"], b=s[k+"_best_match"], plain=s[k];
      if(plain&&!a&&!b){out[k]=plain;continue;}
      if(!a&&!b)continue;
      out[k]=t.map((_,i)=>{
        const v=a?a[i]:null;
        return (v!==null&&v!==undefined)?v:(b?b[i]:null);
      });
    }
    return out;
  };
  const hourly=fold("hourly",OM_H), daily=fold("daily",OM_D);
  // 어느 시점까지 ICON 값이 있었는지 기록 (화면 안내용)
  const ia=(o.hourly["temperature_2m_icon_seamless"]||[]);
  let iconTo=null;
  for(let i=ia.length-1;i>=0;i--)if(ia[i]!=null){iconTo=(o.hourly.time||[])[i];break;}
  return {...o,hourly,daily,iconTo};
}

// 골프 지수. 4~5시간 야외에 머무는 운동이라 미세먼지 감점을 크게 잡았다.
// 풍속 단위는 m/s (기상청 발표 단위와 동일).
const GI_AIR={"좋음":0,"낮음":0,"보통":-3,"나쁨":-20,"높음":-20,"매우나쁨":-40};
// r=강수확률(%), w=풍속(m/s), t=기온(°C)
function gi(r,w,t,airGrade){
  let s=100;
  s-=Math.min(50,r*1.2);
  // 풍속은 m/s. 3m/s(산들바람) 를 넘는 만큼 감점하고 6.3m/s 부터 최대 감점.
  if(w>3)s-=Math.min(30,(w-3)*9);
  if(t<5)s-=Math.min(20,(5-t)*3);
  if(t>34)s-=Math.min(15,(t-34)*3);
  if(airGrade&&GI_AIR[airGrade]!=null)s+=GI_AIR[airGrade];
  // 미세먼지가 나쁘면 날씨가 아무리 좋아도 '최적'으로 보이면 안 된다.
  if(airGrade==="나쁨"||airGrade==="높음")s=Math.min(s,79);      // 최적(80) 불가
  if(airGrade==="매우나쁨")s=Math.min(s,59);                     // 양호(60) 불가
  s=Math.max(0,Math.round(s));
  // 신호색은 유지하되 초록을 청록 쪽으로 옮겨 파란 테마와 부딪히지 않게 한다
  if(s>=80)return{s,l:"최적 ⛳",bg:"#c6ecdd",fg:"#07463a"};
  if(s>=60)return{s,l:"양호 👍",bg:"#dcf0e4",fg:"#15492e"};
  if(s>=40)return{s,l:"보통 😐",bg:"#fcf0ce",fg:"#5c4600"};
  return{s,l:"주의 ⚠️",bg:"#fce0d6",fg:"#7a2a12"};
}
// ── 기상청 체감온도 ────────────────────────────────────
// 기상청 정의는 일사량(복사열)을 반영하지 않는다. Open-Meteo 의
// apparent_temperature 는 일사를 포함해 여름철에 3~4°C 높게 나오므로 쓰지 않는다.
//   · 여름(5~9월) : 습구온도 기반 (2020년 개정식)
//   · 겨울        : 기온 10°C 이하 + 풍속 1.3m/s 이상일 때 풍속냉각지수
// 겨울 공식은 km/h 를 쓰므로 이 함수만 km/h 를 받는다. 호출부에서 m/s×3.6 으로 넘긴다.
//   · 그 밖       : 기온 그대로
function stullTw(ta,rh){
  return ta*Math.atan(0.151977*Math.sqrt(rh+8.313659))
    + Math.atan(ta+rh) - Math.atan(rh-1.676331)
    + 0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh) - 4.686035;
}
function feelTemp(ta,rh,wsKmh,dt){
  if(ta==null)return null;
  const m=dt.getMonth()+1;
  if(m>=5&&m<=9&&rh!=null){
    const tw=stullTw(ta,rh);
    return -0.2442 + 0.55399*tw + 0.45535*ta - 0.0022*tw*tw + 0.00278*tw*ta + 3.0;
  }
  if(ta<=10&&wsKmh!=null&&wsKmh>=4.8){
    const v=Math.pow(wsKmh,0.16);
    return 13.12 + 0.6215*ta - 11.37*v + 0.3965*v*ta;
  }
  return ta;
}
// 날짜별 체감 최고/최저 (시간별 값에서 산출)
function feelDaily(hi){
  const m={};
  if(!hi||!Array.isArray(hi.time)||!Array.isArray(hi.temperature_2m))return m;
  for(let i=0;i<hi.time.length;i++){
    const dt=new Date(hi.time[i]);
    const ws=hi.windspeed_10m?.[i];
    const f=feelTemp(hi.temperature_2m[i],hi.relative_humidity_2m?.[i],
                     ws!=null?ws*3.6:null,dt);
    if(f==null)continue;
    const k=hi.time[i].slice(0,10), o=m[k]=m[k]||{mx:-99,mn:99};
    if(f>o.mx)o.mx=f;
    if(f<o.mn)o.mn=f;
  }
  return m;
}

// null 이 섞인 계열을 끊어진 점선으로 그린다
function segPolyline(arr,tx,ty,color){
  let out="",seg=[];
  const flush=()=>{
    if(seg.length>1)out+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${color}" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>`;
    else if(seg.length===1){const [x,y]=seg[0].split(",");out+=`<circle cx="${x}" cy="${y}" r="2.5" fill="none" stroke="${color}" stroke-width="1.4"/>`;}

}

  if(d.o3)out+=`<div class="dr-air">오존 ${airChip(d.o3)}</div>`;   // 항상 맨 아래
  return out;
}

function kmaDayLine(isoDate,da,i,D){
  if(!KMA_KEY||!KMA||KMA.error)return "";

  const k=kmaDay(isoDate);
  if(!k||(k.tmx==null&&k.tmn==null))return "";
  // 중기 구간은 위 예상값이 이미 이 기상청 값에서 나왔으므로 차이 대신 보정량을 보여준다
  if(D&&(D.useMid||D.useSht)){
    const a=D.adj;
    return `<div class="dr-kma">🏛️ 기상청 <span class="dr-lbl" style="color:var(--ink3)">${D.useMid?"중기":"단기"}·발표값</span>
      <span class="dr-lbl">최고</span><b>${Math.round(k.tmx)}°</b>
      <span class="dr-lbl">최저</span><b>${k.tmn!=null?Math.round(k.tmn)+"°":"–"}</b>
      · 💧${k.pop??"–"}% · ${D.useMid?`${midIcon(k.wf)} ${k.wf||""}`:`${kmaIcon(k.sky,k.pty)} ${kmaDesc(k.sky,k.pty)}`}
      <span style="opacity:.8">→ 코스 해발 ${COURSE.ele}m 보정 ${a>=0?"+":""}${a.toFixed(1)}°</span></div>`;
  }
  const om_x=da.temperature_2m_max?.[i], om_n=da.temperature_2m_min?.[i];
  const d=(a,b)=>(a==null||b==null)?"":` <span style="opacity:.75">(${(a-b)>0?"+":""}${Math.round((a-b)*10)/10})</span>`;
  // 기상청이 최고/최저를 직접 발표하지 않은 날은 * 로 구분
  const mk=v=>v?`<span title="기상청 시간별 값에서 산출한 값" style="opacity:.65">*</span>`:"";
  const src=k.mid?`<span class="dr-lbl" style="color:var(--ink3)">중기·고도미적용</span>`
                 :`<span class="dr-lbl" style="color:var(--ink3)">단기·고도미적용</span>`;
  return `<div class="dr-kma">🏛️ 기상청 ${src}·
    <span class="dr-lbl">최고</span><b>${k.tmx!=null?Math.round(k.tmx)+"°":"–"}</b>${mk(k.tmxD)}${d(k.tmx,om_x)}
    <span class="dr-lbl">최저</span><b>${k.tmn!=null?Math.round(k.tmn)+"°":"–"}</b>${mk(k.tmnD)}${d(k.tmn,om_n)}
    · 💧${k.pop??"–"}%${k.pop!=null&&da.precipitation_probability_max?.[i]!=null?d(k.pop,da.precipitation_probability_max[i]):""}
    · ${k.mid?`${midIcon(k.wf)} ${k.wf||""}`:`${kmaIcon(k.sky,k.pty)} ${kmaDesc(k.sky,k.pty)}`}</div>`;
}

// 기상청 시간대별 스트립. 예상 날씨 스트립과 완전히 같은 모양으로 그린다.
// 시간대별 통합값.
// 기상청(실황·초단기·단기)을 우선 쓰고, 없는 시각은 예보 모델로 메운다.
// 기상청 5km 격자값에는 그 격자의 지형 고도가 이미 반영되어 있으므로 추가 보정은 하지 않는다.
function unifiedHourly(hi,h0,totalH){
  const out=[];
  const adj=shtTempAdj();
  for(let i=h0;i<totalH;i++){
    const t=new Date(hi.time[i]);
    const k=kmaAt(t);
    const useK=!!(k&&k.tmp!=null);
    out.push({
      t,i,iso:hi.time[i],
      tmp:useK?k.tmp+adj:hi.temperature_2m[i],
      pop:(useK&&k.pop!=null)?k.pop:(hi.precipitation_probability?.[i]??0),
      wind:(useK&&k.wsd!=null)?k.wsd:(hi.windspeed_10m?.[i]??0),   // m/s
      wdir:(useK&&k.vec!=null)?k.vec:(hi.winddirection_10m?.[i]??0),
      reh:(useK&&k.reh!=null)?k.reh:(hi.relative_humidity_2m?.[i]??null),
      icon:useK?kmaIcon(k.sky,k.pty):(WIC[hi.weathercode?.[i]]||"🌡️"),
      desc:useK?kmaDesc(k.sky,k.pty):(WMO[hi.weathercode?.[i]]||""),
      uv:hi.uv_index?.[i],                 // UV 는 기상청이 주지 않아 모델값
      rainAmt:hi.precipitation?.[i]??0,    // 강수량(mm) — 기상청은 범위 문구(PCP)만 줘서 항상 모델값
      src:useK?(k.src||"기상청"):"모델",
    });
  }
  return out;
}

// 예상 날씨 / 기상청 날씨 두 스트립을 같이 움직인다.
function syncHScroll(){
  const els=Array.prototype.slice.call(document.querySelectorAll(".hscroll"));
  if(!els.length)return;
  if(SCROLL_X)els.forEach(e=>{e.scrollLeft=SCROLL_X;});
  if(els.length<2){
    els[0].addEventListener("scroll",()=>{SCROLL_X=els[0].scrollLeft;},{passive:true});
    return;
  }
  let lock=false;
  els.forEach(el=>{
    el.addEventListener("scroll",()=>{
      if(lock)return;
      lock=true;
      SCROLL_X=el.scrollLeft;
      els.forEach(o=>{if(o!==el&&o.scrollLeft!==SCROLL_X)o.scrollLeft=SCROLL_X;});
      // 다음 프레임에 잠금 해제 (되먹임 방지)
      if(typeof requestAnimationFrame==="function")requestAnimationFrame(()=>{lock=false;});
      else setTimeout(()=>{lock=false;},0);
    },{passive:true});
  });
}

// 검색어/이름 정규화: 공백·점 제거, CC/GC/컨트리클럽 등 접미어 통일
function nrm(s){
  return s.toLowerCase()
    .replace(/[\s.·\-_()]/g,"")
    .replace(/c\.c|컨트리클럽|컨트리\s*클럽/g,"cc")
    .replace(/g\.c|골프클럽|골프\s*클럽/g,"gc")
    .replace(/골프앤리조트|골프&리조트|골프리조트/g,"gr");
}
// 접미어까지 떼어낸 핵심 이름 (레이크사이드cc -> 레이크사이드)
function core(s){return nrm(s).replace(/(cc|gc|gr|골프장|클럽|리조트)/g,"");}

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
// 한글 문자열의 초성 추출 (세이지우드 -> ㅅㅇㅈㅇㄷ)
function chosung(s){
  let o="";
  for(const ch of s){
    const c=ch.charCodeAt(0)-0xAC00;
    if(c>=0&&c<11172)o+=CHO[Math.floor(c/588)];
    else if(/\S/.test(ch))o+=ch.toLowerCase();
  }
  return o;
}
function isChoQuery(q){return /^[ㄱ-ㅎ]+$/.test(q.replace(/\s/g,""));}

// 점수가 높은 순으로 후보 인덱스 반환
function searchDB(raw){
  const q=(raw||"").trim();
  if(!q)return[];
  const nq=nrm(q), cq=core(q), toks=q.split(/\s+/).filter(Boolean).map(nrm).filter(Boolean);
  const cho=isChoQuery(q)?q.replace(/\s/g,""):null;
  const out=[];
  for(let i=0;i<DB.length;i++){
    const c=DB[i], nName=nrm(c[0]), cName=core(c[0]), nReg=nrm(c[1]);
    // 별칭(브랜드명·통칭)도 검색 대상에 포함한다
    const hay=nName+" "+nReg+(c[7]?" "+nrm(c[7]):"");
    let sc=-1;
    if(cho){                                      // 초성 검색
      if(chosung(c[0]).replace(/\s/g,"").includes(cho))sc=45;
    }
    else if(cName&&cq&&cName===cq)sc=100;         // 핵심 이름 완전일치
    else if(nName===nq)sc=98;
    else if(cName&&cq&&cName.startsWith(cq))sc=90;
    else if(nName.startsWith(nq))sc=88;
    else if(nName.includes(nq))sc=75;
    else if(cName&&cq&&cName.includes(cq))sc=70;
    else if(cName&&cq&&cq.includes(cName)&&cName.length>=2)sc=68;  // "세이지우드 여수경도" 안에 이름이 들어있는 경우
    else if(toks.length>1){
      // 모든 낱말이 맞지 않아도, 맞은 낱말 비율만큼 점수를 준다.
      // "세이지우드 여수 경도" 처럼 브랜드명이 섞여도 찾을 수 있게 한다.
      let hit=0;
      for(const t of toks)if(hay.includes(t))hit++;
      if(hit)sc=42+Math.round(18*hit/toks.length);
    }
    else if(hay.includes(nq))sc=55;               // 별칭(브랜드명)으로 검색
    else if(nReg.includes(nq))sc=40;              // 지역명으로 검색
    if(sc>=0)out.push([sc,-c[4],i]);              // 동점이면 고지대 우선
  }
  out.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  return out.slice(0,12).map(r=>r[2]);
}

function showSuggestions(q){
  const idx=searchDB(q);
  if(!idx.length){
    setSlist(`<div class="si" style="color:var(--ink3);justify-content:center">검색 결과가 없습니다</div>`,true);
    return;
  }
  setSlist(idx.map(i=>{
    const c=DB[i];
    return `<div class="si" onclick="pickFromDB(${i})">
      <span class="si-nm">${highlight(c[0],q)}</span>
      <span class="si-loc">${c[1]} · ${c[4]}m</span>
    </div>`;
  }).join(""),true);
}

function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function highlight(name,q){
  const t=(q||"").trim();
  if(!t||isChoQuery(t))return name;
  for(const p of t.split(/\s+/).filter(Boolean)){
    if(!p)continue;
    name=name.replace(new RegExp(`(${esc(p)})`,"gi"),
      '<span style="color:var(--brand);font-weight:700">$1</span>');
  }
  return name;
}

  showSuggestions(q);
}

// 못 가져왔는지 여부. 조용히 사라지면 값이 빠진 것을 알 수 없어 따로 남긴다.
let FIELD_ERR=null;
async function loadFieldTemp(){
  FIELD=null; FIELD_ERR=null;
  const site=FIELD_SITE;
  if(!site||!FIELD_RELAY)return;                 // 중계 주소 없으면 생략
  const ck="ft_"+site;
  try{
    const c=JSON.parse(localStorage.getItem(ck)||"null");
    if(c&&Date.now()-c.t<FIELD_TTL){FIELD=c.d;return;}
  }catch(e){}
  try{
    const target=`https://www.sagewood.co.kr/api/open/${site}/weather`;
    const r=await fetch(FIELD_RELAY+encodeURIComponent(target),{cache:"no-store"});
    if(!r.ok){FIELD_ERR="중계 오류 "+r.status;return;}
    const d=await r.json();
    const t=d?parseFloat(d.temperature):NaN;
    if(!isNaN(t)){
      FIELD={temp:t,cond:d.weatherCondition||"",
             time:d.weatherTime||"",hum:d.humidity,pm25:d.pm25,air:d.airQuality};
      try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:FIELD}));}catch(e){}
    }else{
      FIELD_ERR="현장 값 없음";
    }
  }catch(e){FIELD_ERR="연결 실패";}
}

// 격자 변환: 위경도 → 기상청 동네예보 격자(nx,ny). Lambert Conformal Conic.
function dfsXy(lat,lon){
  const RE=6371.00877,GRID=5.0,SLAT1=30.0,SLAT2=60.0,OLON=126.0,OLAT=38.0,XO=43,YO=136;
  const D=Math.PI/180, re=RE/GRID, s1=SLAT1*D, s2=SLAT2*D, ol=OLON*D, oa=OLAT*D;
  let sn=Math.tan(Math.PI*0.25+s2*0.5)/Math.tan(Math.PI*0.25+s1*0.5);
  sn=Math.log(Math.cos(s1)/Math.cos(s2))/Math.log(sn);
  let sf=Math.tan(Math.PI*0.25+s1*0.5);
  sf=Math.pow(sf,sn)*Math.cos(s1)/sn;
  let ro=Math.tan(Math.PI*0.25+oa*0.5);
  ro=re*sf/Math.pow(ro,sn);
  let ra=Math.tan(Math.PI*0.25+lat*D*0.5);
  ra=re*sf/Math.pow(ra,sn);
  let th=lon*D-ol;
  if(th>Math.PI)th-=2*Math.PI;
  if(th<-Math.PI)th+=2*Math.PI;
  th*=sn;
  return {nx:Math.floor(ra*Math.sin(th)+XO+0.5), ny:Math.floor(ro-ra*Math.cos(th)+YO+0.5)};
}
function ymd(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;}
// 단기예보 발표시각: 02·05·08·11·14·17·20·23시 (+10분 후 조회 가능)
function kmaBase(now){
  const SLOTS=[2,5,8,11,14,17,20,23];
  const d=new Date(now.getTime());
  let h=d.getHours();
  if(d.getMinutes()<15)h-=1;                       // 발표 직후 여유
  let s=null;
  for(let i=SLOTS.length-1;i>=0;i--)if(SLOTS[i]<=h){s=SLOTS[i];break;}
  if(s===null){d.setDate(d.getDate()-1);s=23;}     // 자정~02시는 전일 23시 발표
  return {date:ymd(d), time:String(s).padStart(2,"0")+"00"};
}
// 초단기실황: 매시 정시 발표, 약 40분 뒤 조회 가능
function kmaNcstBase(now){
  const d=new Date(now.getTime());
  if(d.getMinutes()<45)d.setHours(d.getHours()-1);
  return {date:ymd(d),time:String(d.getHours()).padStart(2,"0")+"00"};
}
// 초단기예보: 매시 30분 발표, 약 45분 뒤 조회 가능
function kmaSrtBase(now){
  const d=new Date(now.getTime()-45*60*1000);
  return {date:ymd(d),time:String(d.getHours()).padStart(2,"0")+"30"};
}

// 단기예보는 +3일까지라 그 뒤가 비었다. 중기예보로 이어 붙인다.
//   getMidTa       지점코드(예: 11D10201 인제) → 일별 최고/최저기온
//   getMidLandFcst 권역코드(예: 11D10000 강원영서) → 날씨·강수확률(오전/오후)
// 발표는 06시·18시. 항목 번호 N 은 "발표일 + N일" 을 뜻한다(4~10).
function midBase(now){
  const d=new Date(now.getTime());
  let t;
  if(d.getHours()>=18)t="1800";
  else if(d.getHours()>=6)t="0600";
  else {d.setDate(d.getDate()-1);t="1800";}
  return {date:ymd(d),time:t,tmFc:ymd(d)+t};
}
// 중기 육상예보 권역은 지점코드 접두어로 정해진다 (계층이 아니라 별도 체계)
function midLandOf(ta){
  if(!ta)return null;
  if(ta.startsWith("11B"))return "11B00000";
  if(ta.startsWith("11C1"))return "11C10000";
  if(ta.startsWith("11C2"))return "11C20000";
  if(ta.startsWith("11D1"))return "11D10000";
  if(ta.startsWith("11D2"))return "11D20000";
  if(ta.startsWith("11F1"))return "11F10000";
  if(ta.startsWith("11F2"))return "11F20000";
  if(ta.startsWith("11G"))return "11G00000";
  if(ta.startsWith("11H1"))return "11H10000";
  if(ta.startsWith("11H2"))return "11H20000";
  return null;
}
// 중기예보 날씨 문구 → 아이콘
function midIcon(w){
  if(!w)return "🌡️";
  if(/눈/.test(w)&&/비/.test(w))return "🌨️";
  if(/눈/.test(w))return "❄️";
  if(/소나기/.test(w))return "🌦️";
  if(/비/.test(w))return "🌧️";
  if(/흐리고/.test(w))return "🌦️";
  if(/흐림/.test(w))return "☁️";
  if(/구름많음/.test(w))return "⛅";

  return "🌡️";
}
async function loadMid(){
  if(!KMA_KEY||!COURSE.midTa)return null;
  const b=midBase(new Date());
  const land=midLandOf(COURSE.midTa);
  const ck=`mid_${COURSE.midTa}_${b.tmFc}`;
  try{
    const c=JSON.parse(localStorage.getItem(ck)||"null");
    if(c&&Date.now()-c.t<KMA_TTL)return c.d;
  }catch(e){}
  const one=async(op,rid)=>{
    const q=new URLSearchParams({serviceKey:KMA_KEY,pageNo:"1",numOfRows:"10",
      dataType:"JSON",regId:rid,tmFc:b.tmFc});
    const r=await fetch("https://apis.data.go.kr/1360000/MidFcstInfoService/"+op+"?"+q.toString());
    if(!r.ok)throw new Error(op+" HTTP "+r.status);
    const j=await r.json();
    const it=j?.response?.body?.items?.item;
    if(!it)throw new Error(j?.response?.header?.resultMsg||op+" 응답 없음");
    return Array.isArray(it)?it[0]:it;
  };
  try{
    const [ta,lf]=await Promise.all([
      one("getMidTa",COURSE.midTa),
      land?one("getMidLandFcst",land):Promise.resolve(null),
    ]);
    const base=new Date(+b.date.slice(0,4),+b.date.slice(4,6)-1,+b.date.slice(6,8));
    const days={};
    for(let n=4;n<=10;n++){
      const d=new Date(base.getTime()); d.setDate(d.getDate()+n);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const tmx=ta?parseFloat(ta["taMax"+n]):null, tmn=ta?parseFloat(ta["taMin"+n]):null;
      // 8일 이후는 오전/오후 구분 없이 하루 한 값만 발표된다
      const am=lf?(lf["rnSt"+n+"Am"]??lf["rnSt"+n]):null;
      const pm=lf?(lf["rnSt"+n+"Pm"]??lf["rnSt"+n]):null;
      const wfa=lf?(lf["wf"+n+"Am"]??lf["wf"+n]):null;
      const wfp=lf?(lf["wf"+n+"Pm"]??lf["wf"+n]):null;
      const pops=[am,pm].filter(v=>v!=null&&v!=="").map(Number);
      days[key]={
        tmx:isNaN(tmx)?null:tmx, tmn:isNaN(tmn)?null:tmn,
        pop:pops.length?Math.max(...pops):null,
        wf:wfp||wfa||null, mid:true
      };
    }

    try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:out}));}catch(e){}

async function loadKma(){
  KMA=null;
  if(!KMA_KEY)return;
  const {nx,ny}=dfsXy(COURSE.lat,COURSE.lon);
  const now=new Date();
  const vb=kmaBase(now), nb=kmaNcstBase(now), sb=kmaSrtBase(now);
  const ck=`kma3_${nx}_${ny}_${sb.date}${sb.time}`;
  try{
    const c=JSON.parse(localStorage.getItem(ck)||"null");
    if(c&&Date.now()-c.t<KMA_TTL){KMA=c.d;return;}
  }catch(e){}

  const P={nx:String(nx),ny:String(ny)};
  const midP=loadMid();
  const [vil,srt,ncst]=await Promise.all([
    kmaFetch("getVilageFcst",{...P,base_date:vb.date,base_time:vb.time}).catch(e=>({e})),
    kmaFetch("getUltraSrtFcst",{...P,base_date:sb.date,base_time:sb.time}).catch(e=>({e})),
    kmaFetch("getUltraSrtNcst",{...P,base_date:nb.date,base_time:nb.time}).catch(e=>({e})),
  ]);
  if(vil.e&&srt.e&&ncst.e){KMA={error:(vil.e.message||"조회 실패")};return;}

  const hourly={},daily={};
  const put=(k,f,v,srcTag)=>{
    const h=hourly[k]=hourly[k]||{};
    if(h[f]==null||h.src!=="초단기"||srcTag==="초단기"){h[f]=v;}
    if(srcTag==="초단기")h.src="초단기"; else if(!h.src)h.src="단기";
  };
  // 단기예보 먼저 (넓은 범위)
  if(Array.isArray(vil))for(const it of vil){
    const k=it.fcstDate+String(it.fcstTime).padStart(4,"0").slice(0,2), v=it.fcstValue;
    switch(it.category){
      case "TMP": put(k,"tmp",parseFloat(v),"단기"); break;
      case "POP": put(k,"pop",parseInt(v,10),"단기"); break;
      case "SKY": put(k,"sky",String(v),"단기"); break;
      case "PTY": put(k,"pty",String(v),"단기"); break;
      case "WSD": put(k,"wsd",parseFloat(v),"단기"); break;
      case "REH": put(k,"reh",parseInt(v,10),"단기"); break;
      case "TMN": (daily[it.fcstDate]=daily[it.fcstDate]||{}).tmn=parseFloat(v); break;
      case "TMX": (daily[it.fcstDate]=daily[it.fcstDate]||{}).tmx=parseFloat(v); break;
    }
  }
  // 초단기예보로 덮어쓰기 (+6시간). 강수확률(POP)은 초단기에 없으므로 단기예보 값을 유지한다.
  if(Array.isArray(srt))for(const it of srt){
    const k=it.fcstDate+String(it.fcstTime).padStart(4,"0").slice(0,2), v=it.fcstValue;
    switch(it.category){
      case "T1H": put(k,"tmp",parseFloat(v),"초단기"); break;
      case "SKY": put(k,"sky",String(v),"초단기"); break;
      case "PTY": put(k,"pty",String(v),"초단기"); break;
      case "WSD": put(k,"wsd",parseFloat(v),"초단기"); break;
      case "REH": put(k,"reh",parseInt(v,10),"초단기"); break;
    }
  }
  // 초단기실황 = 현재 관측값
  let obs=null;
  if(Array.isArray(ncst)){
    const m={};
    for(const it of ncst)m[it.category]=it.obsrValue;
    if(m.T1H!=null)obs={tmp:parseFloat(m.T1H),reh:m.REH!=null?parseInt(m.REH,10):null,
      wsd:m.WSD!=null?parseFloat(m.WSD):null,pty:m.PTY!=null?String(m.PTY):null,
      rn1:m.RN1!=null?parseFloat(m.RN1):null,
      time:`${nb.time.slice(0,2)}시 관측`};
  }
  // 일별 보강
  for(const k in hourly){
    const d=k.slice(0,8), h=hourly[k], dd=(daily[d]=daily[d]||{});
    if(h.pop!=null)dd.pop=Math.max(dd.pop??0,h.pop);
    if(h.wsd!=null)dd.wsd=Math.max(dd.wsd??0,h.wsd);
    if(k.slice(8)==="15"){dd.sky=h.sky;dd.pty=h.pty;}
    if(dd.sky==null&&h.sky!=null){dd.sky=h.sky;dd.pty=h.pty;}
    // 그 날 몇 시간분 자료가 있는지 세어둔다 (아래에서 파생 가능 여부 판단)
    if(h.tmp!=null){
      dd.n=(dd.n??0)+1;
      dd.hmax=Math.max(dd.hmax??-99,h.tmp);
      dd.hmin=Math.min(dd.hmin??99,h.tmp);
    }
  }
  // 최고/최저는 기상청이 발표한 TMX/TMN 만 쓴다.
  // 하루가 24시간 다 채워진 날에 한해 시간별 값에서 산출하고 * 로 구분한다.
  // (오후에 조회하면 그날 남은 시간만 남아 "최저 33°" 같은 엉뚱한 값이 나오던 문제)
  for(const d in daily){
    const dd=daily[d];
    if(dd.tmx==null&&dd.n>=23&&dd.hmax!=null){dd.tmx=dd.hmax;dd.tmxD=true;}
    if(dd.tmn==null&&dd.n>=23&&dd.hmin!=null){dd.tmn=dd.hmin;dd.tmnD=true;}
    delete dd.n; delete dd.hmax; delete dd.hmin;
  }
  if(!Object.keys(hourly).length&&!obs){KMA={error:"기상청 자료 없음"};return;}
  const mid=await midP;
  KMA={hourly,daily,now:obs,nx,ny,mid:(mid&&!mid.error)?mid:null,midErr:mid&&mid.error||null,
       base:`단기 ${vb.date.slice(4,6)}/${vb.date.slice(6,8)} ${vb.time.slice(0,2)}시 · 초단기 ${sb.time.slice(0,2)}:30 발표`};
  try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:KMA}));}catch(e){}
}

// 로컬시각 → 기상청 키 (YYYYMMDDHH)
function kmaKeyOf(dt){
  return `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,"0")}${String(dt.getDate()).padStart(2,"0")}${String(dt.getHours()).padStart(2,"0")}`;
}
function kmaAt(dt){return KMA&&KMA.hourly?KMA.hourly[kmaKeyOf(dt)]:null;}
function kmaDay(isoDate){
  if(!KMA)return null;
  const s=KMA.daily?KMA.daily[isoDate.replace(/-/g,"")]:null;
  // 단기예보에 최고/최저가 있으면 그것을 쓰고, 없으면 중기예보로 채운다
  if(s&&(s.tmx!=null||s.tmn!=null))return s;
  const m=KMA.mid&&KMA.mid.days?KMA.mid.days[isoDate]:null;
  if(m&&(m.tmx!=null||m.tmn!=null))return {...(s||{}),...m};
  return s;
}

// ── 미세먼지 (에어코리아) ───────────────────────────────
// 실측  : getMsrstnAcctoRltmMesureDnsty  측정소별 PM10·PM2.5
// 예보  : getMinuDustFrcstDspth          오늘~모레, PM10/PM25/O3 등급
// 주간  : getMinuDustWeekFrcstDspth      D+3~D+6, 낮음/보통/높음
// 예보는 권역 문자열("서울 : 좋음,경기남부 : 보통,...")로 오므로 골프장 권역을 골라내야 한다.
const AIR_BASE="https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/";
const AIR_TTL=30*60*1000;
// 대기질 예보 권역. 경기는 북부/남부, 강원은 영서/영동으로 나뉜다.
const GG_NORTH=["고양","의정부","동두천","구리","남양주","파주","양주","포천","연천","가평"];
function airRegionOf(address,midTa){
  const p=(address||"").split(" ")[0], c=(address||"").split(" ")[1]||"";
  if(p==="서울")return "서울";
  if(p==="인천")return "인천";
  if(p==="경기")return GG_NORTH.some(n=>c.startsWith(n))?"경기북부":"경기남부";
  if(p==="강원")return (midTa||"").startsWith("11D2")?"영동":"영서";
  if(["충북","충남","대전","세종","광주","전북","전남","부산","대구","울산","경북","경남","제주"].includes(p))return p;
  return null;
}
// 주간예보는 같은 권역을 '강원영서'처럼 다르게 표기한다
function airRegionWeek(r){
  if(r==="영서")return "강원영서";
  if(r==="영동")return "강원영동";
  return r;
}
const AIR_GRADE={"1":"좋음","2":"보통","3":"나쁨","4":"매우나쁨"};
const AIR_COLOR={"좋음":["#d8f0e0","#0a4a20"],"보통":["#dbeaf8","#0f3a66"],
                 "나쁨":["#fde8d0","#7a3a00"],"매우나쁨":["#fbd8d8","#7a1010"],
                 "낮음":["#d8f0e0","#0a4a20"],"높음":["#fde8d0","#7a3a00"]};
function airChip(g){
  if(!g)return "";
  const c=AIR_COLOR[g]||["#eef4fa","var(--ink2)"];
  return `<span class="ab-g" style="background:${c[0]};color:${c[1]}">${g}</span>`;
}
// 발표시각("2026-08-04 23시 발표")을 비교 가능한 숫자 2026080423 으로 바꾼다
function frcstRank(dataTime){
  const m=/(\d{4})-(\d{2})-(\d{2})\s*(\d{1,2})\s*시/.exec(dataTime||"");
  return m?Number(m[1]+m[2]+m[3]+m[4].padStart(2,"0")):-1;
}
// 권역 문자열에서 우리 권역의 등급만 뽑는다
function pickGrade(str,reg){
  if(!str||!reg)return null;
  for(const part of str.split(",")){
    const [a,b]=part.split(":").map(x=>(x||"").trim());
    if(a===reg&&b)return b;
  }
  return null;
}

let AIR=null;
async function loadAir(){
  AIR=null;
  if(!KMA_KEY)return;
  const reg=airRegionOf(COURSE.address,COURSE.midTa);
  const ck=`air_${COURSE.stn||"-"}_${reg||"-"}_${ymd(new Date())}${String(new Date().getHours()).padStart(2,"0")}`;
  try{
    const c=JSON.parse(localStorage.getItem(ck)||"null");
    if(c&&Date.now()-c.t<AIR_TTL){AIR=c.d;return;}
  }catch(e){}
  const get=async(op,params)=>{
    const q=new URLSearchParams({serviceKey:KMA_KEY,returnType:"json",
      numOfRows:"100",pageNo:"1",...params});
    const r=await fetch(AIR_BASE+op+"?"+q.toString());
    if(!r.ok)throw new Error(op+" HTTP "+r.status);
    const j=await r.json();
    if(j?.OpenAPI_ServiceResponse)throw new Error(j.OpenAPI_ServiceResponse.cmmMsgHeader?.errMsg||op);
    return j?.response?.body?.items||[];
  };
  // 미세먼지 예보는 응답 하나에 전국 권역이 다 들어있다.
  // 골프장을 여러 곳 봐도 한 번만 받아 재사용한다 (일일 호출 한도 절약).
  const shared=async(op,params,key,ttl)=>{
    try{
      const c=JSON.parse(localStorage.getItem(key)||"null");
      if(c&&Date.now()-c.t<ttl)return c.d;
    }catch(e){}
    const v=await get(op,params);
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d:v}));}catch(e){}
    return v;
  };
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today=new Date();
  try{
    const hh=String(today.getHours()).padStart(2,"0");
    // 주간예보는 전일 발표분이 최신인 경우가 많다. 성공한 날짜를 기억해 다음엔 그것부터 시도한다.
    const weekOnce=async()=>{
      let hint=null;
      try{hint=localStorage.getItem("airWkHint");}catch(e){}
      const order=[];
      if(hint)order.push(hint);
      for(let i=0;i<=2;i++){
        const d=new Date(today.getTime()); d.setDate(d.getDate()-i);
        const k=iso(d);
        if(!order.includes(k))order.push(k);
      }
      for(const k of order){
        const v=await shared("getMinuDustWeekFrcstDspth",{searchDate:k},`airwk_${k}`,6*60*60*1000)
                  .catch(()=>null);
        if(v&&v.length){
          try{localStorage.setItem("airWkHint",k);}catch(e){}
          return v[0];
        }
      }
      return null;
    };
    const [now0,fc,wk]=await Promise.all([
      COURSE.stn?get("getMsrstnAcctoRltmMesureDnsty",{stationName:COURSE.stn,dataTerm:"DAILY",ver:"1.3"}).catch(()=>null):Promise.resolve(null),
      shared("getMinuDustFrcstDspth",{searchDate:iso(today)},`airfc_${iso(today)}_${hh}`,AIR_TTL).catch(()=>null),
      weekOnce(),
    ]);
    const now=now0&&now0.length?now0[0]:null;

    // 일자별 등급 정리.
    // 응답 하나에 하루 4회(05·11·17·23시) 발표분이 모두 들어 있고 최신 발표가 앞쪽에 온다.
    // 그냥 순회하며 덮어쓰면 가장 오래된 발표가 남으므로 발표시각을 비교해 최신만 채택한다.
    // '값이 있는 최신 발표'를 골라야 한다. 오존은 저녁 발표에서 '오늘' 항목이 빠지는데
    // (해가 진 뒤엔 예보 의미가 없다) 무조건 최신을 쓰면 오늘 오존이 사라진다.
    const FC_FIELD={PM10:"pm10",PM25:"pm25",O3:"o3"};
    const days={},picked={};
    for(const x of (fc||[])){
      const d=x.informData, f=FC_FIELD[x.informCode], g=pickGrade(x.informGrade,reg);
      if(!d||!f||!g)continue;
      const r=frcstRank(x.dataTime), sk=d+"|"+f;
      if(picked[sk]!=null&&picked[sk]>=r)continue;
      picked[sk]=r;
      (days[d]=days[d]||{})[f]=g;
    }
    // 주간예보(낮음/보통/높음)로 D+3 이후 보강
    if(wk){
      const wreg=airRegionWeek(reg);
      for(const n of ["One","Two","Three","Four"]){
        const dt=wk["frcst"+n+"Dt"], cn=wk["frcst"+n+"Cn"];
        const g=pickGrade(cn,wreg);
        if(dt&&g){days[dt]=days[dt]||{}; if(!days[dt].pm10)days[dt].week=g;}
      }
    }
    AIR={
      reg,
      stn:COURSE.stn,
      now:now?{pm10:now.pm10Value,pm10g:AIR_GRADE[now.pm10Grade]||null,
               pm25:now.pm25Value,pm25g:AIR_GRADE[now.pm25Grade]||null,
               time:now.dataTime}:null,
      days,
      base:(fc&&fc.length)
        ?fc.reduce((a,b)=>frcstRank(b.dataTime)>frcstRank(a.dataTime)?b:a).dataTime
        :null,
      wkNote:wk?wk.gwthcnd:null
    };
    try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:AIR}));}catch(e){}
  }catch(e){
    AIR={error:e.message};
  }
}
// 오늘 기준 가장 나쁜 등급 (골프지수 감점용)
const AIR_RANK={"좋음":0,"낮음":0,"보통":1,"나쁨":2,"높음":2,"매우나쁨":3};
function airWorstToday(){
  if(!AIR||AIR.error)return null;
  const k=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,"0")}-${String(new Date().getDate()).padStart(2,"0")}`;
  const d=AIR.days?AIR.days[k]:null;
  const cands=[];
  if(d){["pm10","pm25","o3","week"].forEach(f=>{if(d[f])cands.push(d[f]);});}
  if(AIR.now){[AIR.now.pm10g,AIR.now.pm25g].forEach(g=>{if(g)cands.push(g);});}
  if(!cands.length)return null;
  return cands.reduce((a,b)=>(AIR_RANK[b]??0)>(AIR_RANK[a]??0)?b:a);
}

    // 기상청이 느린 날에는 10초 가까이 화면에 나타나지 않았다.
    // 또 한 곳이 예외를 던지면 Promise.all 이 거부되어 앱 전체가 오류 화면으로
    // 바뀌었다. 이제 실패는 각자 삼키고 나머지는 그대로 보여준다.
    const paint=()=>{ if(FIELD||FIELD_ERR||KMA||AIR)render(); };

      <small style="opacity:.8">${e.message}</small><br><br>
      인터넷 연결을 확인하고<br>
      <button onclick="loadWeather()" style="background:var(--brand);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px">다시 시도</button>
    </div></div>`);
  }
}

// ── 렌더링 ─────────────────────────────────────────────
function render(){
  if(!W)return;
  const hi=W.hourly,da=W.daily;
  const FD=feelDaily(hi);   // 기상청식 체감 일별 최고/최저
  const now=new Date();
  let h0=hi.time.findIndex(t=>new Date(t)>=now);
  if(h0<0)h0=0;
  // 현재 카드도 기상청 기준. 실황(관측)이 있으면 기온·습도·풍속은 그것을 쓴다.
  const UH=unifiedHourly(hi,h0,Math.min(h0+72,hi.time.length));
  const u0=UH[0]||{};
  const ob=(KMA&&!KMA.error&&KMA.now)?KMA.now:null;
  const SADJ=shtTempAdj();
  const kmaT=ob&&ob.tmp!=null?ob.tmp+SADJ:u0.tmp;
  const kmaH=ob&&ob.reh!=null?ob.reh:u0.reh;
  const curW=ob&&ob.wsd!=null?ob.wsd:u0.wind;   // m/s
  // 강수량(mm). 실황(RN1, 지난 1시간 실측)이 있으면 그것을, 없으면 모델 예보값을 쓴다.
  const curRainAmt=ob&&ob.rn1!=null&&!isNaN(ob.rn1)?ob.rn1:(u0.rainAmt??0);
  // 세이지우드를 보는 중이고 현장 실측값이 있으면, 대표 '현재온도'는 격자 추정치가 아니라
  // 코스에서 직접 잰 실측값을 쓴다 — 2026-08-04 관측 결과 격자 추정과 최대 3.9°C 까지
  // 벌어졌고(고도차로는 0.4°C 밖에 안 설명됨) 사용자가 실측값을 기준으로 쓰기로 결정했다.
  // 습도도 센서값이 있으면 그걸 쓴다(체감온도 계산에 같이 들어간다). 풍속은 센서가 안 재서
  // 그대로 기상청/모델 값을 쓴다. 다른 골프장을 볼 때는 이 분기를 안 타 기존 동작 그대로다.
  const isSagewood=COURSE.name==="세이지우드 CC 홍천";
  const useField=isSagewood&&FIELD&&FIELD.temp!=null;
  const curT=useField?FIELD.temp:kmaT;
  const curH=useField&&FIELD.hum!=null?FIELD.hum:kmaH;
  const cur={
    temp:Math.round(curT),
    feel:Math.round(feelTemp(curT,curH,curW!=null?curW*3.6:null,new Date(hi.time[h0]))),
    hum:curH,
    rain:u0.pop??0,
    rainAmt:curRainAmt,
    wind:fmtWind(curW??0),
    wdir:u0.wdir??0,
    icon:u0.icon||"🌡️",
    desc:u0.desc||"",
    uv:u0.uv,
    // 실황은 소수점 첫째 자리까지 발표되므로 출처 표기에 정확한 값을 함께 보여준다
    src:useField?`세이지우드 현장 실측 ${FIELD.temp.toFixed(1)}°${FIELD.time?` (${FIELD.time})`:""}`
        :ob?`기상청 실황 ${ob.tmp.toFixed(1)}°${SADJ?` · 고도보정 ${SADJ>0?"+":""}${SADJ.toFixed(1)}°`:""}`
        :(u0.src==="모델"?"예보 모델":"기상청 "+(u0.src||"")),
  };
  const airG=airWorstToday();
  const g=gi(cur.rain,cur.wind,cur.temp,airG);
  const now2=new Date();
  const updated=`${now2.getHours()}:${String(now2.getMinutes()).padStart(2,"0")} 기준`;
  const stamp=`${now2.getMonth()+1}월 ${now2.getDate()}일(${DAYS[now2.getDay()]}) ${now2.getHours()}시 현재`;

  let html=`
<div id="curCard">
  <div class="cloc"><span class="cnm">📍 ${COURSE.name}</span><span class="cloc-r">${COURSE.address}</span></div>
  <div class="cstamp">${stamp}<span style="font-weight:400;opacity:.8">${COURSE.ele!=null?` · 해발 ${COURSE.ele}m`:""}${useField?" · 📡 현장실측":(cur.src.indexOf("기상청")>=0?" · 🏛️ 기상청":"")}</span></div>
  <div class="crow">
    <div><div class="btlabel">현재온도</div><div class="btemp">${cur.temp}°</div><div class="feel">체감 ${cur.feel}°${useField?` · <span style="opacity:.7">기상청 추정 ${Math.round(kmaT)}°</span>`
      :(FIELD?` · <b style="font-weight:700">세이지우드홍천현장실측온도 ${FIELD.temp.toFixed(1)}°</b>`
      :(FIELD_ERR?` · <span style="opacity:.7">세이지우드 현장온도 불러오지 못함</span>`:""))} · ${cur.desc}</div></div>
    <div class="wico">${cur.icon}</div>
  </div>
  <div class="meta4">
    <div class="mi"><div class="mi-v">${cur.rain}%</div><div class="mi-l">💧강수확률</div>
      <div class="mi-l" style="margin-top:2px">☔${cur.rainAmt.toFixed(1)}mm</div></div>
    <div class="mi"><div class="mi-v">${cur.wind}</div><div class="mi-l">🌬️풍속m/s</div></div>
    <div class="mi"><div class="mi-v" style="font-size:12px">${wd(cur.wdir)}</div><div class="mi-l">🧭풍향</div></div>
    <div class="mi"><div class="mi-v">${cur.uv!=null?cur.uv.toFixed(1):"-"}</div><div class="mi-l">☀️UV</div></div>
  </div>
  <div style="margin-top:10px;font-size:11px;opacity:.55;text-align:right">${(FIELD&&!useField)?`세이지우드 현장관측 ${FIELD.time} · `:""}${cur.src} · ${updated} 갱신</div>
</div>
<div id="gibox" style="background:${g.bg};color:${g.fg}">
  <div class="gi-n">${g.s}</div>
  <div><div class="gi-h">골프 지수 — ${g.l}</div>
  <div class="gi-s">강수 ${cur.rain}% · 풍속 ${cur.wind}m/s · ${cur.temp}°C${airG?` · 미세먼지 ${airG}`:""}</div></div>
</div>
<div id="tabs">
  <div class="tb${TAB==="hourly"?" on":""}" onclick="setTab('hourly')">⏱ 시간대별</div>
  <div class="tb${TAB==="daily"?" on":""}" onclick="setTab('daily')">🗓️ 일별 예보</div>
  <div class="tb${TAB==="chart"?" on":""}" onclick="setTab('chart')">📊 그래프</div>
</div>`;

  // 시간대별 72시간
  if(TAB==="hourly"){
    const totalH=Math.min(h0+72,hi.time.length);
    const nMdl=UH.filter(u=>u.src==="모델").length;
    const strip=(rows)=>{
      let s=`<div class="hscroll"><div class="hrow">`,last="";
      rows.forEach((r,n)=>{
        const t=r.t,hr=t.getHours(), ds=`${t.getMonth()+1}/${t.getDate()}`;
        if(ds!==last){
          const lbl=n===0?`오늘 ${ds}(${DAYS[t.getDay()]})`:`${ds}(${DAYS[t.getDay()]})`;
          s+=`<div class="day-sep"><div class="day-sep-inner">${lbl}</div></div>`;
          last=ds;
        }
        s+=`<div class="hc${n===0?" now":""}">
          <div class="ht">${hr===0?"자정":hr+"시"}${r.mark||""}</div>
          <div class="hico">${r.icon}</div>
          <div class="htemp">${r.val}</div>
          <div class="hrain">💧${r.pop}</div>
          <div class="hrain" style="opacity:.75">☔${r.rain}mm</div>
          <div class="hwind">🌬️${r.wind}<i>m/s</i></div>
          ${airCell(r.iso)}
        </div>`;
      });
      return s+`</div></div>`;
    };
    // 위: 기상청 + 코스 고도 보정
    html+=`<div class="sec">🏛️ 기상청 + 고도 적용 · 시간대별 최대 72시간</div>
    <div class="legend">칸마다 위에서부터 &nbsp;<b>시각</b> · <b>날씨</b> · <b>기온</b> · <b>💧강수확률</b> · <b>☔강수량(mm)</b> · <b>🌬️풍속(m/s)</b> · <b>미세</b> · <b>오존</b>
    <br><span style="opacity:.85">기상청 발표값에 코스 해발 ${COURSE.ele}m 보정 ${SADJ>=0?"+":""}${SADJ.toFixed(1)}° 를 적용한 값입니다.
    (기상청 5km 격자에도 지형고도가 일부 반영되어 있어 보정폭이 크지 않습니다.)
    강수량(mm)은 기상청이 숫자로 주지 않아 항상 예보 모델 값입니다.
    ${nMdl?`기상청 자료가 없는 ${nMdl}칸은 예보 모델(<b>모델</b> 표시)입니다.`:""}</span></div>`;
    html+=strip(UH.map(u=>({
      t:u.t,iso:u.iso,icon:u.icon,
      val:Math.round(u.tmp)+"°",
      pop:u.pop+"%", rain:u.rainAmt.toFixed(1), wind:fmtWind(u.wind),
      mark:u.src==="초단기"?`<span title="초단기예보" style="color:var(--brand2)">·</span>`
          :(u.src==="모델"?`<span class="hsrc">모델</span>`:""),
    })));
  }

  // ── 일별 표시값 ──
  // 0~3일  : 예상 날씨(ICON, 코스 고도 반영)
  // 4~10일 : 기상청 중기예보 + 코스 고도 보정  ← 전지구 모델과 기상청이 크게 갈려 기상청을 기준으로 삼는다
  // 11일~  : 기상청 중기 범위를 넘어서므로 예상 날씨 유지
  const MADJ=midTempAdj();
  const DDAY=da.time.map((t,i)=>{
    const k=kmaDay(t);
    const useMid=!!(k&&k.mid&&k.tmx!=null);          // 4~10일: 중기예보(지점값) + 고도보정
    const useSht=!!(k&&!k.mid&&(k.tmx!=null||k.tmn!=null));  // 0~3일: 단기예보(격자값) 그대로
    const om_x=da.temperature_2m_max?.[i], om_n=da.temperature_2m_min?.[i];
    const adj=useMid?MADJ:(useSht?SADJ:0);
    const kx=(useMid||useSht)&&k.tmx!=null?k.tmx+adj:null;
    const kn=(useMid||useSht)&&k.tmn!=null?k.tmn+adj:null;
    return {
      t,i,k,useMid,useSht,adj,
      src:(useMid||useSht)?"기상청+고도":"모델",
      tmax:kx!=null?kx:om_x,
      tmin:kn!=null?kn:om_n,
      pop:(useMid||useSht)&&k.pop!=null?k.pop:(da.precipitation_probability_max?.[i]??0),
      wind:da.windspeed_10m_max?.[i]??0,
      icon:useMid?midIcon(k.wf):(useSht&&k.sky?kmaIcon(k.sky,k.pty):(WIC[da.weathercode?.[i]]||"🌡️")),
      desc:useMid?(k.wf||""):(useSht&&k.sky?kmaDesc(k.sky,k.pty):(WMO[da.weathercode?.[i]]||"")),
    };
  });

  // 기상청 자료(단기+중기)가 있는 마지막 날까지만 보여준다. 그 뒤는 신뢰도가 낮아 생략.
  let lastK=-1;
  DDAY.forEach((D,i)=>{ if(D.useMid||D.useSht)lastK=i; });
  const DSHOW=lastK>=0?DDAY.slice(0,lastK+1):DDAY;

  // 일별 예보
  if(TAB==="daily"){
    html+=`<div class="sec">🏛️ 기상청 + 고도 적용 · ${DSHOW.length}일 예보 (클릭 시 상세)</div>`;
    html+=`<div class="legend">
      각 줄 왼쪽부터 &nbsp;<b>날짜</b> · <b>날씨</b>와 <b>골프지수</b> · <b>💧강수확률·강수량(mm)</b> ·
      <b>최고/최저 기온</b>
      <br><span style="opacity:.85">기온은 모두 기상청 발표값에 코스 해발 ${COURSE.ele}m 보정을 적용한 값입니다 —
      단기예보(0~3일) ${SADJ>=0?"+":""}${SADJ.toFixed(1)}° · 중기예보(4~10일) ${MADJ>=0?"+":""}${MADJ.toFixed(1)}°.
      기상청 자료가 없는 날은 표시하지 않습니다.</span>
      ${KMA_KEY&&KMA&&!KMA.error?`<br>각 줄 아래 <b>🏛️ 기상청 발표값</b> 은 보정 전 원본입니다${KMA.mid?` · 중기 ${KMA.mid.base}`:""}`:""}
      ${AIR&&!AIR.error&&AIR.days&&Object.keys(AIR.days).length?`<br>😷 줄은 <b>에어코리아 미세먼지 예보</b>, 그 아래 <b>오존</b> 줄입니다 (오늘~모레는 등급, 이후는 농도 전망).`:""}
      <br><span style="opacity:.85">※ 기온·강수확률·바람·하늘상태는 모두 기상청 발표값 기준입니다. UV·일출/일몰만 예보 모델을 씁니다.</span>
    </div>`;
    DSHOW.forEach((D)=>{
      const t=D.t,i=D.i;
      const dt=new Date(t+"T12:00:00");
      const dc=dt.getDay()===0?"#c02020":dt.getDay()===6?"#2060c0":"var(--ink)";
      const g2=gi(D.pop,D.wind,D.tmax??20,airGradeOf(t));
      const isOpen=OPEN===i;
      html+=`<div class="dr${isOpen?" open":""}" onclick="toggleDay(${i})">
        <div class="dr-row">
          <div class="dr-date" style="color:${dc}">${dl(t,i)}</div>
          <div class="dr-ico">${D.icon}</div>
          <div class="dr-mid">
            <div class="dr-desc">${D.desc}</div>
            <span class="gi-badge" style="background:${g2.bg};color:${g2.fg}">${g2.s}점 ${g2.l}</span>
          </div>
          <div class="dr-rain">💧${D.pop}%<br><span style="font-size:10px;opacity:.8">${(da.precipitation_sum?.[D.i]??0).toFixed(1)}mm</span></div>
          <div class="dr-temps"><div class="dr-src">${D.src}</div>
            <span class="dr-lbl">최고</span>${D.tmax!=null?Math.round(D.tmax)+"°":"–"}<br>
            <span class="dr-lbl">최저</span><span class="dr-lo">${D.tmin!=null?Math.round(D.tmin)+"°":"–"}</span></div>
        </div>
        ${kmaDayLine(t,da,i,D)}
        ${airDayLine(t)}
        <div class="dd${isOpen?" show":""}">
          <div><div class="ddi-l">체감 최고/최저</div><div class="ddi-v">${FD[t]?Math.round(FD[t].mx)+"° / "+Math.round(FD[t].mn)+"°":"–"}</div></div>
          <div><div class="ddi-l">강수량</div><div class="ddi-v">${(da.precipitation_sum?.[i]??0).toFixed(1)} mm</div></div>
          <div><div class="ddi-l">최대 풍속</div><div class="ddi-v">${fmtWind(D.wind??0)} m/s</div></div>
          <div><div class="ddi-l">풍향</div><div class="ddi-v">${wd(da.winddirection_10m_dominant?.[i]??0)}</div></div>
          <div><div class="ddi-l">UV 지수</div><div class="ddi-v">${da.uv_index_max?.[i]?.toFixed(1)||"-"}</div></div>
          <div><div class="ddi-l">일출 / 일몰</div><div class="ddi-v">${(da.sunrise?.[i]||"").split("T")[1]||"-"} / ${(da.sunset?.[i]||"").split("T")[1]||"-"}</div></div>
        </div>
      </div>`;
    });
  }

  // 그래프
  if(TAB==="chart"){
    const labs=DSHOW.map((D,i)=>{ const t=D.t;
      if(i===0)return"오늘";if(i===1)return"내일";
      const d=new Date(t+"T12:00:00");return`${d.getMonth()+1}/${d.getDate()}`;
    });
    const bw=34,gap=5,pw=DSHOW.length*(bw+gap)+8;
    const kAll=[].concat(DSHOW.map(d=>d.tmax),DSHOW.map(d=>d.tmin),
      kmxOf(da),kmnOf(da)).filter(v=>v!=null);
    const maxT=Math.max(...kAll),minT=Math.min(...kAll),tR=maxT-minT||1;
    const svgH=110,pad=16;
    const tx=i=>i*(bw+gap)+bw/2+4;
    const ty=v=>svgH-pad-((v-minT)/tR)*(svgH-pad*2);
    const maxPts=DSHOW.map((d,i)=>d.tmax!=null?`${tx(i)},${ty(d.tmax)}`:null).filter(Boolean).join(" ");
    const minPts=DSHOW.map((d,i)=>d.tmin!=null?`${tx(i)},${ty(d.tmin)}`:null).filter(Boolean).join(" ");

    // 기상청 일별 값 (없는 날은 null)
    const kmx=DSHOW.map(D=>{const k=kmaDay(D.t);return k&&k.tmx!=null?k.tmx:null;});
    const kmn=DSHOW.map(D=>{const k=kmaDay(D.t);return k&&k.tmn!=null?k.tmn:null;});
    const kpop=DSHOW.map(D=>{const k=kmaDay(D.t);return k&&k.pop!=null?k.pop:null;});
    const hasK=KMA_KEY&&KMA&&!KMA.error&&kmx.some(v=>v!=null);
    html+=`<div class="chart-card"><div class="chart-t">💧 일별 강수확률 (%) · 강수량(mm)</div>
    <div style="display:flex;gap:12px;font-size:11.5px;margin-bottom:8px;color:var(--ink2);flex-wrap:wrap">
      <span><span style="color:#3080d0">■</span> 기상청 기준</span>
      ${hasK?`<span><span style="color:#0a3a6a">■</span> 기상청(단기+중기, 10일)</span>`:""}
    </div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <div class="bar-wrap" style="width:${pw}px">`;
    DSHOW.forEach((D,i)=>{
      const v=D.pop, kv=kpop[i], mm=(da.precipitation_sum?.[D.i]??0).toFixed(1);
      html+=`<div class="bw"><div class="bv" style="color:#2060b0">${v??0}%${kv!=null?`<span style="color:#0a3a6a">/${kv}</span>`:""}</div>
        <div style="display:flex;align-items:flex-end;gap:2px">
          <div class="bar" style="width:${kv!=null?13:28}px;height:${Math.max(3,v??0)}px;background:#3080d0"></div>
          ${kv!=null?`<div class="bar" style="width:13px;height:${Math.max(3,kv)}px;background:#0a3a6a"></div>`:""}
        </div>
        <div style="font-size:9px;color:var(--ink3);margin-top:2px">☔${mm}mm</div>
        <div class="bl">${labs[i]}</div></div>`;
    });
    html+=`</div></div></div>`;

    html+=`<div class="chart-card"><div class="chart-t">🌡️ 일별 최고·최저 기온 (°C)</div>
    <div style="display:flex;gap:12px;font-size:11.5px;margin-bottom:8px;color:var(--ink2);flex-wrap:wrap">
      <span><span style="color:#c03020">●</span> 최고</span>
      <span><span style="color:#2060c0">●</span> 최저</span>
      ${hasK?`<span><span style="color:#c03020">┈</span> 최고(기상청 발표값)</span>
      <span><span style="color:#2060c0">┈</span> 최저(기상청 발표값)</span>
      <span style="opacity:.7">실선은 기상청+고도보정</span>`:""}
    </div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <svg width="${pw}" height="${svgH}" viewBox="0 0 ${pw} ${svgH}" style="overflow:visible;display:block">
      <polyline points="${maxPts}" fill="none" stroke="#c03020" stroke-width="2" stroke-linejoin="round"/>
      <polyline points="${minPts}" fill="none" stroke="#2060c0" stroke-width="2" stroke-linejoin="round"/>
      ${hasK?segPolyline(kmx,tx,ty,"#c03020"):""}
      ${hasK?segPolyline(kmn,tx,ty,"#2060c0"):""}
      ${DSHOW.map((d,i)=>d.tmax==null?"":`<circle cx="${tx(i)}" cy="${ty(d.tmax)}" r="3" fill="#c03020"/><text x="${tx(i)}" y="${ty(d.tmax)-6}" text-anchor="middle" font-size="9" fill="#c03020">${Math.round(d.tmax)}°</text>`).join("")}
      ${DSHOW.map((d,i)=>d.tmin==null?"":`<circle cx="${tx(i)}" cy="${ty(d.tmin)}" r="3" fill="#2060c0"/><text x="${tx(i)}" y="${ty(d.tmin)+13}" text-anchor="middle" font-size="9" fill="#2060c0">${Math.round(d.tmin)}°</text>`).join("")}
    </svg>
    <div style="display:flex;gap:${gap}px;width:${pw}px;padding-top:4px">
      ${labs.map(l=>`<div style="width:${bw}px;flex-shrink:0;text-align:center;font-size:9px;color:var(--ink2)">${l}</div>`).join("")}
    </div></div></div>`;

    html+=airCharts(DSHOW,labs,pw);
  }

  setMain(html);
}

function setTab(t){TAB=t;render();}
function toggleDay(i){OPEN=OPEN===i?-1:i;render();}

// ── 홈 화면 앱(PWA) ────────────────────────────────────
// 서비스 워커: 오프라인 표시 + 설치 요건 충족. file:// 로 열면 등록되지 않는다.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// 기기·브라우저별로 홈 화면 추가 방법이 달라 안내를 나눠 띄운다.
let INSTALL_EVT=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INSTALL_EVT=e;showPwaBar();});

function pwaEnv(){
  const ua=navigator.userAgent;
  const standalone=window.matchMedia("(display-mode: standalone)").matches
    ||window.navigator.standalone===true;
  return {
    standalone,
    ios:/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),
    inApp:/KAKAOTALK|FB_IAB|FBAN|Instagram|Line\/|NAVER\(inapp/i.test(ua),
    kakao:/KAKAOTALK/i.test(ua)
  };
}

function showPwaBar(){
  const el=document.getElementById("pwaBar");
  if(!el)return;
  const E=pwaEnv();
  if(E.standalone)return;                               // 이미 앱으로 실행 중
  try{ if(localStorage.getItem("pwaHide")==="1"&&!E.inApp)return; }catch(e){}

  let html="";
  if(E.inApp){
    // 카카오톡·페이스북 등 인앱 브라우저에서는 홈 화면 추가가 불가능하다.
    html=`📱 <b>홈 화면에 추가하려면 기본 브라우저로 열어야 합니다.</b><br>
      카카오톡 같은 앱 안의 브라우저에서는 추가 기능이 없습니다.
      <div class="pw-row">
        ${E.kakao?`<button class="pw-go" onclick="pwaOpenExternal()">기본 브라우저로 열기</button>`:""}
        <span style="font-size:12px;opacity:.8">또는 우측 하단 ⋯ → ‘다른 브라우저로 열기’</span>
      </div>`;
  }else if(INSTALL_EVT){
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b>
      <div class="pw-row">
        <button class="pw-go" onclick="pwaInstall()">홈 화면에 추가</button>
        <button class="pw-x" onclick="pwaDismiss()">나중에</button>
      </div>`;
  }else if(E.ios){
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b><br>
      아래 <b>공유</b> 버튼 <span style="font-size:15px">􀈂</span> 을 누르고
      <b>‘홈 화면에 추가’</b> 를 선택하세요.
      <div class="pw-row"><button class="pw-x" onclick="pwaDismiss()">닫기</button></div>`;
  }else{
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b><br>
      브라우저 메뉴에서 <b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b> 를 선택하세요.
      <div class="pw-row"><button class="pw-x" onclick="pwaDismiss()">닫기</button></div>`;
  }
  el.innerHTML=html;
  el.style.display="block";
}

function pwaInstall(){
  if(!INSTALL_EVT)return;
  INSTALL_EVT.prompt();
  INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;pwaDismiss();});
}
function pwaDismiss(){
  try{localStorage.setItem("pwaHide","1");}catch(e){}
  const el=document.getElementById("pwaBar");
  if(el)el.style.display="none";
}
// 카카오톡 인앱 브라우저 → 기기 기본 브라우저로 탈출
function pwaOpenExternal(){
  const u=location.href;
  location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);
}
showPwaBar();
renderHome();
</script>


</body></html>
