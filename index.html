   반드시 px 좌표로 명시해야 한다. center 로 두면 뷰박스 중심을 축으로 돌아버린다. */
.hi-x{animation:hix 1.9s cubic-bezier(.22,.55,.35,1) infinite}

  0%{transform:translateX(-14px)}
  70%{transform:translateX(89px)}
  100%{transform:translateX(89px)}
}
.hi-y{animation:hiy 1.9s ease-in infinite}

  0%,70%{transform:translateY(56px)}
  73%{transform:translateY(57px)}
  92%{transform:translateY(72px)}
  100%{transform:translateY(72px)}
}
/* 구르기: 이동거리 103px ÷ 공 둘레 39px ≈ 2.6회전 = 950° */
.hi-roll{transform-origin:8px 8px;animation:hiroll 1.9s cubic-bezier(.22,.55,.35,1) infinite}
@keyframes hiroll{0%{transform:rotate(0)}70%,100%{transform:rotate(950deg)}}

.hi-fade{animation:hifade 1.9s linear infinite}
@keyframes hifade{0%,93%{opacity:1}95%,100%{opacity:0}}
.hi-sh{transform-origin:8px 70px;animation:hish 1.9s ease-in infinite}
@keyframes hish{
  0%,70%{opacity:.24;transform:scale(1,1)}
  80%{opacity:.1;transform:scale(.6,.5)}
  86%{opacity:0}
  100%{opacity:0}
}

function gi(r,w,t){
  let s=100;
  s-=Math.min(50,r*1.2);
  if(w>10)s-=Math.min(30,(w-10)*2.5);
  if(t<5)s-=Math.min(20,(5-t)*3);

  s=Math.max(0,Math.round(s));
  if(s>=80)return{s,l:"최적 ⛳",bg:"#c8f0d0",fg:"#0a3a18"};

// ── 기상청 체감온도 ────────────────────────────────────
// 기상청 정의는 일사량(복사열)을 반영하지 않는다. Open-Meteo 의
// apparent_temperature 는 일사를 포함해 여름철에 3~4°C 높게 나오므로 쓰지 않는다.
//   · 여름(5~9월) : 습구온도 기반 (2020년 개정식)
//   · 겨울        : 기온 10°C 이하 + 풍속 1.3m/s(≈4.8km/h) 이상일 때 풍속냉각지수
//   · 그 밖       : 기온 그대로
function stullTw(ta,rh){
  return ta*Math.atan(0.151977*Math.sqrt(rh+8.313659))
    + Math.atan(ta+rh) - Math.atan(rh-1.676331)
    + 0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh) - 4.686035;
}
function feelTemp(ta,rh,wsKmh,dt){
  if(ta==null)return null;
  const m=dt.getMonth()+1;
  if(m>=5&&m<=9&&rh!=null){
    const tw=stullTw(ta,rh);
    return -0.2442 + 0.55399*tw + 0.45535*ta - 0.0022*tw*tw + 0.00278*tw*ta + 3.0;
  }
  if(ta<=10&&wsKmh!=null&&wsKmh>=4.8){
    const v=Math.pow(wsKmh,0.16);
    return 13.12 + 0.6215*ta - 11.37*v + 0.3965*v*ta;
  }
  return ta;
}

                     hi.windspeed_10m?.[i],dt);
    if(f==null)continue;
    const k=hi.time[i].slice(0,10), o=m[k]=m[k]||{mx:-99,mn:99};

}

function segPolyline(arr,tx,ty,color){
  let out="",seg=[];
  const flush=()=>{
    if(seg.length>1)out+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${color}" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>`;
    else if(seg.length===1){const [x,y]=seg[0].split(",");out+=`<circle cx="${x}" cy="${y}" r="2.5" fill="none" stroke="${color}" stroke-width="1.4"/>`;}
    seg=[];
  };
  arr.forEach((v,i)=>{ if(v==null){flush();return;} seg.push(`${tx(i)},${ty(v)}`); });
  flush();
  return out;
}

// 예상 날씨 / 기상청 날씨 두 스트립을 같이 움직인다.
function syncHScroll(){
  const els=Array.prototype.slice.call(document.querySelectorAll(".hscroll"));
  if(!els.length)return;
  if(SCROLL_X)els.forEach(e=>{e.scrollLeft=SCROLL_X;});
  if(els.length<2){
    els[0].addEventListener("scroll",()=>{SCROLL_X=els[0].scrollLeft;},{passive:true});
    return;
  }
  let lock=false;
  els.forEach(el=>{
    el.addEventListener("scroll",()=>{
      if(lock)return;
      lock=true;
      SCROLL_X=el.scrollLeft;
      els.forEach(o=>{if(o!==el&&o.scrollLeft!==SCROLL_X)o.scrollLeft=SCROLL_X;});
      // 다음 프레임에 잠금 해제 (되먹임 방지)
      if(typeof requestAnimationFrame==="function")requestAnimationFrame(()=>{lock=false;});
      else setTimeout(()=>{lock=false;},0);
    },{passive:true});
  });
}

// 검색어/이름 정규화: 공백·점 제거, CC/GC/컨트리클럽 등 접미어 통일
function nrm(s){
  return s.toLowerCase()
    .replace(/[\s.·\-_()]/g,"")
    .replace(/c\.c|컨트리클럽|컨트리\s*클럽/g,"cc")
    .replace(/g\.c|골프클럽|골프\s*클럽/g,"gc")
    .replace(/골프앤리조트|골프&리조트|골프리조트/g,"gr");
}
// 접미어까지 떼어낸 핵심 이름 (레이크사이드cc -> 레이크사이드)
function core(s){return nrm(s).replace(/(cc|gc|gr|골프장|클럽|리조트)/g,"");}

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
// 한글 문자열의 초성 추출 (세이지우드 -> ㅅㅇㅈㅇㄷ)
function chosung(s){
  let o="";
  for(const ch of s){
    const c=ch.charCodeAt(0)-0xAC00;
    if(c>=0&&c<11172)o+=CHO[Math.floor(c/588)];
    else if(/\S/.test(ch))o+=ch.toLowerCase();
  }
  return o;
}
function isChoQuery(q){return /^[ㄱ-ㅎ]+$/.test(q.replace(/\s/g,""));}

// 점수가 높은 순으로 후보 인덱스 반환
function searchDB(raw){
  const q=(raw||"").trim();
  if(!q)return[];
  const nq=nrm(q), cq=core(q), toks=q.split(/\s+/).filter(Boolean).map(nrm).filter(Boolean);
  const cho=isChoQuery(q)?q.replace(/\s/g,""):null;
  const out=[];
  for(let i=0;i<DB.length;i++){
    const c=DB[i], nName=nrm(c[0]), cName=core(c[0]), nReg=nrm(c[1]);
    // 별칭(브랜드명·통칭)도 검색 대상에 포함한다
    const hay=nName+" "+nReg+(c[5]?" "+nrm(c[5]):"");
    let sc=-1;
    if(cho){                                      // 초성 검색
      if(chosung(c[0]).replace(/\s/g,"").includes(cho))sc=45;
    }
    else if(cName&&cq&&cName===cq)sc=100;         // 핵심 이름 완전일치
    else if(nName===nq)sc=98;
    else if(cName&&cq&&cName.startsWith(cq))sc=90;
    else if(nName.startsWith(nq))sc=88;
    else if(nName.includes(nq))sc=75;
    else if(cName&&cq&&cName.includes(cq))sc=70;
    else if(cName&&cq&&cq.includes(cName)&&cName.length>=2)sc=68;  // "세이지우드 여수경도" 안에 이름이 들어있는 경우
    else if(toks.length>1){
      // 모든 낱말이 맞지 않아도, 맞은 낱말 비율만큼 점수를 준다.
      // "세이지우드 여수 경도" 처럼 브랜드명이 섞여도 찾을 수 있게 한다.
      let hit=0;
      for(const t of toks)if(hay.includes(t))hit++;
      if(hit)sc=42+Math.round(18*hit/toks.length);
    }
    else if(nReg.includes(nq))sc=40;              // 지역명으로 검색
    if(sc>=0)out.push([sc,-c[4],i]);              // 동점이면 고지대 우선
  }
  out.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  return out.slice(0,12).map(r=>r[2]);
}

// 격자 변환: 위경도 → 기상청 동네예보 격자(nx,ny). Lambert Conformal Conic.
function dfsXy(lat,lon){
  const RE=6371.00877,GRID=5.0,SLAT1=30.0,SLAT2=60.0,OLON=126.0,OLAT=38.0,XO=43,YO=136;
  const D=Math.PI/180, re=RE/GRID, s1=SLAT1*D, s2=SLAT2*D, ol=OLON*D, oa=OLAT*D;
  let sn=Math.tan(Math.PI*0.25+s2*0.5)/Math.tan(Math.PI*0.25+s1*0.5);
  sn=Math.log(Math.cos(s1)/Math.cos(s2))/Math.log(sn);
  let sf=Math.tan(Math.PI*0.25+s1*0.5);
  sf=Math.pow(sf,sn)*Math.cos(s1)/sn;
  let ro=Math.tan(Math.PI*0.25+oa*0.5);
  ro=re*sf/Math.pow(ro,sn);
  let ra=Math.tan(Math.PI*0.25+lat*D*0.5);
  ra=re*sf/Math.pow(ra,sn);
  let th=lon*D-ol;
  if(th>Math.PI)th-=2*Math.PI;
  if(th<-Math.PI)th+=2*Math.PI;
  th*=sn;
  return {nx:Math.floor(ra*Math.sin(th)+XO+0.5), ny:Math.floor(ro-ra*Math.cos(th)+YO+0.5)};
}
function ymd(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;}
// 단기예보 발표시각: 02·05·08·11·14·17·20·23시 (+10분 후 조회 가능)
function kmaBase(now){
  const SLOTS=[2,5,8,11,14,17,20,23];
  const d=new Date(now.getTime());
  let h=d.getHours();
  if(d.getMinutes()<15)h-=1;                       // 발표 직후 여유
  let s=null;
  for(let i=SLOTS.length-1;i>=0;i--)if(SLOTS[i]<=h){s=SLOTS[i];break;}
  if(s===null){d.setDate(d.getDate()-1);s=23;}     // 자정~02시는 전일 23시 발표
  return {date:ymd(d), time:String(s).padStart(2,"0")+"00"};
}
// 초단기실황: 매시 정시 발표, 약 40분 뒤 조회 가능
function kmaNcstBase(now){
  const d=new Date(now.getTime());
  if(d.getMinutes()<45)d.setHours(d.getHours()-1);
  return {date:ymd(d),time:String(d.getHours()).padStart(2,"0")+"00"};
}
// 초단기예보: 매시 30분 발표, 약 45분 뒤 조회 가능
function kmaSrtBase(now){
  const d=new Date(now.getTime()-45*60*1000);
  return {date:ymd(d),time:String(d.getHours()).padStart(2,"0")+"30"};
}
const KSKY={"1":"맑음","3":"구름많음","4":"흐림"};
const KSKY_IC={"1":"☀️","3":"⛅","4":"☁️"};
const KPTY={"0":"","1":"비","2":"비/눈","3":"눈","4":"소나기","5":"빗방울","6":"빗방울눈날림","7":"눈날림"};
const KPTY_IC={"1":"🌧️","2":"🌨️","3":"❄️","4":"🌦️","5":"🌦️","6":"🌨️","7":"❄️"};
function kmaDesc(sky,pty){
  if(pty&&pty!=="0")return KPTY[pty]||"";
  return KSKY[sky]||"";
}
function kmaIcon(sky,pty){
  if(pty&&pty!=="0")return KPTY_IC[pty]||"🌧️";
  return KSKY_IC[sky]||"🌡️";
}

let KMA=null;
// {hourly:{"YYYYMMDDHH":{tmp,pop,sky,pty,wsd,reh,src}}, daily:{...}, now:{...}, base, nx, ny}
//
// 기상청은 구간별로 다른 API 를 쓴다. 하나만 쓰면 값이 크게 틀린다.
//   현재      → 초단기실황 getUltraSrtNcst (관측값, T1H)
//   +6시간까지 → 초단기예보 getUltraSrtFcst (T1H, 1시간 단위)
//   +3일까지   → 단기예보  getVilageFcst  (TMP, 강수확률 POP 는 이것만 제공)
// 초단기 자료가 있는 시각은 초단기가 단기예보를 덮어쓴다.
const KMA_BASE_URL="https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/";
async function kmaFetch(op,params){
  const q=new URLSearchParams({serviceKey:KMA_KEY,pageNo:"1",numOfRows:"1000",dataType:"JSON",...params});
  const r=await fetch(KMA_BASE_URL+op+"?"+q.toString());
  if(!r.ok)throw new Error(op+" HTTP "+r.status);
  const j=await r.json();
  const it=j?.response?.body?.items?.item;
  if(!it)throw new Error(j?.response?.header?.resultMsg
      ||j?.OpenAPI_ServiceResponse?.cmmMsgHeader?.returnAuthMsg||op+" 응답 없음");
  return Array.isArray(it)?it:[it];
}

async function loadKma(){
  KMA=null;
  if(!KMA_KEY)return;
  const {nx,ny}=dfsXy(COURSE.lat,COURSE.lon);
  const now=new Date();
  const vb=kmaBase(now), nb=kmaNcstBase(now), sb=kmaSrtBase(now);
  const ck=`kma3_${nx}_${ny}_${sb.date}${sb.time}`;
  try{
    const c=JSON.parse(localStorage.getItem(ck)||"null");
    if(c&&Date.now()-c.t<KMA_TTL){KMA=c.d;return;}
  }catch(e){}

  const P={nx:String(nx),ny:String(ny)};
  const [vil,srt,ncst]=await Promise.all([
    kmaFetch("getVilageFcst",{...P,base_date:vb.date,base_time:vb.time}).catch(e=>({e})),
    kmaFetch("getUltraSrtFcst",{...P,base_date:sb.date,base_time:sb.time}).catch(e=>({e})),
    kmaFetch("getUltraSrtNcst",{...P,base_date:nb.date,base_time:nb.time}).catch(e=>({e})),
  ]);
  if(vil.e&&srt.e&&ncst.e){KMA={error:(vil.e.message||"조회 실패")};return;}

  const hourly={},daily={};
  const put=(k,f,v,srcTag)=>{
    const h=hourly[k]=hourly[k]||{};
    if(h[f]==null||h.src!=="초단기"||srcTag==="초단기"){h[f]=v;}
    if(srcTag==="초단기")h.src="초단기"; else if(!h.src)h.src="단기";
  };
  // 단기예보 먼저 (넓은 범위)
  if(Array.isArray(vil))for(const it of vil){
    const k=it.fcstDate+String(it.fcstTime).padStart(4,"0").slice(0,2), v=it.fcstValue;
    switch(it.category){
      case "TMP": put(k,"tmp",parseFloat(v),"단기"); break;
      case "POP": put(k,"pop",parseInt(v,10),"단기"); break;
      case "SKY": put(k,"sky",String(v),"단기"); break;
      case "PTY": put(k,"pty",String(v),"단기"); break;
      case "WSD": put(k,"wsd",parseFloat(v),"단기"); break;
      case "REH": put(k,"reh",parseInt(v,10),"단기"); break;
      case "TMN": (daily[it.fcstDate]=daily[it.fcstDate]||{}).tmn=parseFloat(v); break;
      case "TMX": (daily[it.fcstDate]=daily[it.fcstDate]||{}).tmx=parseFloat(v); break;
    }
  }
  // 초단기예보로 덮어쓰기 (+6시간). 강수확률(POP)은 초단기에 없으므로 단기예보 값을 유지한다.
  if(Array.isArray(srt))for(const it of srt){
    const k=it.fcstDate+String(it.fcstTime).padStart(4,"0").slice(0,2), v=it.fcstValue;
    switch(it.category){
      case "T1H": put(k,"tmp",parseFloat(v),"초단기"); break;
      case "SKY": put(k,"sky",String(v),"초단기"); break;
      case "PTY": put(k,"pty",String(v),"초단기"); break;
      case "WSD": put(k,"wsd",parseFloat(v),"초단기"); break;
      case "REH": put(k,"reh",parseInt(v,10),"초단기"); break;
    }
  }
  // 초단기실황 = 현재 관측값
  let obs=null;
  if(Array.isArray(ncst)){
    const m={};
    for(const it of ncst)m[it.category]=it.obsrValue;
    if(m.T1H!=null)obs={tmp:parseFloat(m.T1H),reh:m.REH!=null?parseInt(m.REH,10):null,
      wsd:m.WSD!=null?parseFloat(m.WSD):null,pty:m.PTY!=null?String(m.PTY):null,
      rn1:m.RN1!=null?parseFloat(m.RN1):null,
      time:`${nb.time.slice(0,2)}시 관측`};
  }
  // 일별 보강
  for(const k in hourly){
    const d=k.slice(0,8), h=hourly[k], dd=(daily[d]=daily[d]||{});
    if(h.pop!=null)dd.pop=Math.max(dd.pop??0,h.pop);
    if(h.wsd!=null)dd.wsd=Math.max(dd.wsd??0,h.wsd);
    if(k.slice(8)==="15"){dd.sky=h.sky;dd.pty=h.pty;}
    if(dd.sky==null&&h.sky!=null){dd.sky=h.sky;dd.pty=h.pty;}
    // 기상청이 TMX/TMN 을 주지 않는 날은 기상청 시간별 값에서 산출 (파생값 * 표시)
    if(dd.tmx==null&&h.tmp!=null){dd.tmx=Math.max(dd.tmxD??-99,h.tmp);dd.tmxD=dd.tmx;}
    if(dd.tmn==null&&h.tmp!=null){dd.tmn=Math.min(dd.tmnD??99,h.tmp);dd.tmnD=dd.tmn;}
  }
  if(!Object.keys(hourly).length&&!obs){KMA={error:"기상청 자료 없음"};return;}
  KMA={hourly,daily,now:obs,nx,ny,
       base:`단기 ${vb.date.slice(4,6)}/${vb.date.slice(6,8)} ${vb.time.slice(0,2)}시 · 초단기 ${sb.time.slice(0,2)}:30 발표`};
  try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:KMA}));}catch(e){}
}

// 로컬시각 → 기상청 키 (YYYYMMDDHH)
function kmaKeyOf(dt){
  return `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,"0")}${String(dt.getDate()).padStart(2,"0")}${String(dt.getHours()).padStart(2,"0")}`;
}
function kmaAt(dt){return KMA&&KMA.hourly?KMA.hourly[kmaKeyOf(dt)]:null;}
function kmaDay(isoDate){
  if(!KMA||!KMA.daily)return null;
  return KMA.daily[isoDate.replace(/-/g,"")]||null;
}

        <div class="ht">${hr===0?"자정":hr+"시"}</div>
        <div class="hico">${WIC[hi.weathercode?.[i]]||"🌡️"}</div>
        <div class="htemp">${Math.round(hi.temperature_2m[i])}°</div>
        <div class="hrain">💧${hi.precipitation_probability?.[i]??0}%</div>
        <div class="hwind">💨${Math.round(hi.windspeed_10m?.[i]??0)}</div>
      </div>`;
    }
    html+=`</div></div>`;
    html+=kmaHourlyStrip(hi,h0,totalH);
  }

  // 16일 예보
  if(TAB==="daily"){
    html+=`<div class="sec">예상 날씨 (고도 반영) · 일별 예보 (클릭 시 상세)</div>`;
    if(KMA_KEY&&KMA&&!KMA.error)
      html+=`<div class="km-note" style="margin:-4px 0 8px">각 줄 아래 🏛️ 는 기상청 날씨(+3일)입니다.</div>`;
    da.time.forEach((t,i)=>{
      const dt=new Date(t+"T12:00:00");
      const dc=dt.getDay()===0?"#c02020":dt.getDay()===6?"#2060c0":"#1a2e1a";
      const g2=gi(da.precipitation_probability_max?.[i]??0,da.windspeed_10m_max?.[i]??0,da.temperature_2m_max?.[i]??20);
      const isOpen=OPEN===i;
      html+=`<div class="dr${isOpen?" open":""}" onclick="toggleDay(${i})">
        <div class="dr-row">
          <div class="dr-date" style="color:${dc}">${dl(t,i)}</div>
          <div class="dr-ico">${WIC[da.weathercode?.[i]]||"🌡️"}</div>
          <div class="dr-mid">
            <div class="dr-desc">${WMO[da.weathercode?.[i]]||""}</div>
            <span class="gi-badge" style="background:${g2.bg};color:${g2.fg}">${g2.s}점 ${g2.l}</span>
          </div>
          <div class="dr-rain">💧${da.precipitation_probability_max?.[i]??0}%</div>
          <div class="dr-temps">${Math.round(da.temperature_2m_max?.[i]??0)}°<br><span class="dr-lo">${Math.round(da.temperature_2m_min?.[i]??0)}°</span></div>
        </div>
        ${kmaDayLine(t,da,i)}
        <div class="dd${isOpen?" show":""}">
          <div><div class="ddi-l">체감 최고/최저</div><div class="ddi-v">${FD[t]?Math.round(FD[t].mx)+"° / "+Math.round(FD[t].mn)+"°":"–"}</div></div>
          <div><div class="ddi-l">강수량</div><div class="ddi-v">${(da.precipitation_sum?.[i]??0).toFixed(1)} mm</div></div>
          <div><div class="ddi-l">최대 풍속</div><div class="ddi-v">${Math.round(da.windspeed_10m_max?.[i]??0)} km/h</div></div>
          <div><div class="ddi-l">풍향</div><div class="ddi-v">${wd(da.winddirection_10m_dominant?.[i]??0)}</div></div>
          <div><div class="ddi-l">UV 지수</div><div class="ddi-v">${da.uv_index_max?.[i]?.toFixed(1)||"-"}</div></div>
          <div><div class="ddi-l">일출 / 일몰</div><div class="ddi-v">${(da.sunrise?.[i]||"").split("T")[1]||"-"} / ${(da.sunset?.[i]||"").split("T")[1]||"-"}</div></div>
        </div>
      </div>`;
    });
  }

  // 그래프
  if(TAB==="chart"){
    const labs=da.time.map((t,i)=>{
      if(i===0)return"오늘";if(i===1)return"내일";
      const d=new Date(t+"T12:00:00");return`${d.getMonth()+1}/${d.getDate()}`;
    });
    const bw=34,gap=5,pw=da.time.length*(bw+gap)+8;
    const kAll=[].concat(da.temperature_2m_max,da.temperature_2m_min,
      kmxOf(da),kmnOf(da)).filter(v=>v!=null);
    const maxT=Math.max(...kAll),minT=Math.min(...kAll),tR=maxT-minT||1;
    const svgH=110,pad=16;
    const tx=i=>i*(bw+gap)+bw/2+4;
    const ty=v=>svgH-pad-((v-minT)/tR)*(svgH-pad*2);
    const maxPts=da.temperature_2m_max.map((v,i)=>`${tx(i)},${ty(v)}`).join(" ");
    const minPts=da.temperature_2m_min.map((v,i)=>`${tx(i)},${ty(v)}`).join(" ");
    const maxW=Math.max(...da.windspeed_10m_max)||1;

    // 기상청 일별 값 (없는 날은 null)
    const kmx=da.time.map(t=>{const k=kmaDay(t);return k&&k.tmx!=null?k.tmx:null;});
    const kmn=da.time.map(t=>{const k=kmaDay(t);return k&&k.tmn!=null?k.tmn:null;});
    const kpop=da.time.map(t=>{const k=kmaDay(t);return k&&k.pop!=null?k.pop:null;});
    const hasK=KMA_KEY&&KMA&&!KMA.error&&kmx.some(v=>v!=null);
    html+=`<div class="chart-card"><div class="chart-t">💧 강수 확률 (%)${hasK?` <span style="font-weight:400;color:#1a5a9a">· 진한 막대 = 기상청 날씨</span>`:""}</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <div class="bar-wrap" style="width:${pw}px">`;
    da.precipitation_probability_max.forEach((v,i)=>{
      const kv=kpop[i];
      html+=`<div class="bw"><div class="bv" style="color:#2060b0">${v??0}%${kv!=null?`<span style="color:#0a3a6a">/${kv}</span>`:""}</div>
        <div style="display:flex;align-items:flex-end;gap:2px">
          <div class="bar" style="width:${kv!=null?13:28}px;height:${Math.max(3,v??0)}px;background:#3080d0"></div>
          ${kv!=null?`<div class="bar" style="width:13px;height:${Math.max(3,kv)}px;background:#0a3a6a"></div>`:""}
        </div>
        <div class="bl">${labs[i]}</div></div>`;
    });
    html+=`</div></div></div>`;

    html+=`<div class="chart-card"><div class="chart-t">🌡️ 기온 (°C)</div>
    <div style="display:flex;gap:12px;font-size:12px;margin-bottom:8px;color:#5a7a5a">
      <span><span style="color:#c03020">●</span> 최고</span><span><span style="color:#2060c0">●</span> 최저</span>
      ${hasK?`<span style="color:#1a5a9a">┈ 기상청 날씨</span>`:""}
    </div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <svg width="${pw}" height="${svgH}" viewBox="0 0 ${pw} ${svgH}" style="overflow:visible;display:block">
      <polyline points="${maxPts}" fill="none" stroke="#c03020" stroke-width="2" stroke-linejoin="round"/>
      <polyline points="${minPts}" fill="none" stroke="#2060c0" stroke-width="2" stroke-linejoin="round"/>
      ${hasK?segPolyline(kmx,tx,ty,"#c03020"):""}
      ${hasK?segPolyline(kmn,tx,ty,"#2060c0"):""}
      ${da.temperature_2m_max.map((v,i)=>`<circle cx="${tx(i)}" cy="${ty(v)}" r="3" fill="#c03020"/><text x="${tx(i)}" y="${ty(v)-6}" text-anchor="middle" font-size="9" fill="#c03020">${Math.round(v)}°</text>`).join("")}
      ${da.temperature_2m_min.map((v,i)=>`<circle cx="${tx(i)}" cy="${ty(v)}" r="3" fill="#2060c0"/><text x="${tx(i)}" y="${ty(v)+13}" text-anchor="middle" font-size="9" fill="#2060c0">${Math.round(v)}°</text>`).join("")}
    </svg>
    <div style="display:flex;gap:${gap}px;width:${pw}px;padding-top:4px">
      ${labs.map(l=>`<div style="width:${bw}px;flex-shrink:0;text-align:center;font-size:9px;color:#5a7a5a">${l}</div>`).join("")}
    </div></div></div>`;

    html+=`<div class="chart-card"><div class="chart-t">💨 최대 풍속 (km/h)</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <div class="bar-wrap" style="width:${pw}px">`;
    da.windspeed_10m_max.forEach((v,i)=>{
      html+=`<div class="bw"><div class="bv" style="color:#1a7a4a">${Math.round(v??0)}</div><div class="bar" style="height:${Math.max(3,Math.round((v??0)/maxW*100))}px;background:#1a7a4a"></div><div class="bl">${labs[i]}</div></div>`;
    });
    html+=`</div></div></div>`;
  }

  setMain(html);
}

function setTab(t){TAB=t;render();}
function toggleDay(i){OPEN=OPEN===i?-1:i;render();}

// ── 홈 화면 앱(PWA) ────────────────────────────────────
// 서비스 워커: 오프라인 표시 + 설치 요건 충족. file:// 로 열면 등록되지 않는다.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// 기기·브라우저별로 홈 화면 추가 방법이 달라 안내를 나눠 띄운다.
let INSTALL_EVT=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INSTALL_EVT=e;showPwaBar();});

function pwaEnv(){
  const ua=navigator.userAgent;
  const standalone=window.matchMedia("(display-mode: standalone)").matches
    ||window.navigator.standalone===true;
  return {
    standalone,
    ios:/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),
    inApp:/KAKAOTALK|FB_IAB|FBAN|Instagram|Line\/|NAVER\(inapp/i.test(ua),
    kakao:/KAKAOTALK/i.test(ua)
  };
}

function showPwaBar(){
  const el=document.getElementById("pwaBar");
  if(!el)return;
  const E=pwaEnv();
  if(E.standalone)return;                               // 이미 앱으로 실행 중
  try{ if(localStorage.getItem("pwaHide")==="1"&&!E.inApp)return; }catch(e){}

  let html="";
  if(E.inApp){
    // 카카오톡·페이스북 등 인앱 브라우저에서는 홈 화면 추가가 불가능하다.
    html=`📱 <b>홈 화면에 추가하려면 기본 브라우저로 열어야 합니다.</b><br>
      카카오톡 같은 앱 안의 브라우저에서는 추가 기능이 없습니다.
      <div class="pw-row">
        ${E.kakao?`<button class="pw-go" onclick="pwaOpenExternal()">기본 브라우저로 열기</button>`:""}
        <span style="font-size:12px;opacity:.8">또는 우측 하단 ⋯ → ‘다른 브라우저로 열기’</span>
      </div>`;
  }else if(INSTALL_EVT){
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b>
      <div class="pw-row">
        <button class="pw-go" onclick="pwaInstall()">홈 화면에 추가</button>
        <button class="pw-x" onclick="pwaDismiss()">나중에</button>
      </div>`;
  }else if(E.ios){
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b><br>
      아래 <b>공유</b> 버튼 <span style="font-size:15px">􀈂</span> 을 누르고
      <b>‘홈 화면에 추가’</b> 를 선택하세요.
      <div class="pw-row"><button class="pw-x" onclick="pwaDismiss()">닫기</button></div>`;
  }else{
    html=`📱 <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b><br>
      브라우저 메뉴에서 <b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b> 를 선택하세요.
      <div class="pw-row"><button class="pw-x" onclick="pwaDismiss()">닫기</button></div>`;
  }
  el.innerHTML=html;
  el.style.display="block";
}

function pwaInstall(){
  if(!INSTALL_EVT)return;
  INSTALL_EVT.prompt();
  INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;pwaDismiss();});
}
function pwaDismiss(){
  try{localStorage.setItem("pwaHide","1");}catch(e){}
  const el=document.getElementById("pwaBar");
  if(el)el.style.display="none";
}
// 카카오톡 인앱 브라우저 → 기기 기본 브라우저로 탈출
function pwaOpenExternal(){
  const u=location.href;
  location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);
}
showPwaBar();
</script>


</body></html>
